<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WolfClash Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a1d;--s1:#15122e;--s2:#1e1a42;--s3:#2a2563;--line:#ffffff14;--tx:#e8eeff;--mu:#8fa0c8;--ac:#ff5b2e;--g:#2ee59d;--r:#ff4d6d;--gold:#ffc233;--b:#00b8ff}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--tx);display:flex;min-height:100vh}
aside{width:230px;background:#0c1428;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h2{font-size:17px;padding:6px 10px 16px;display:flex;gap:8px;align-items:center}
aside a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--mu);cursor:pointer;font-size:14px;margin-bottom:2px}
aside a:hover{background:var(--s1)}aside a.on{background:var(--ac);color:#fff}
aside a b{margin-left:auto;background:var(--r);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
main{flex:1;min-width:0;padding:22px 24px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.top h1{font-size:22px;flex:1}
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;overflow:auto}
.card h3{font-size:15px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:16px}.kpi small{color:var(--mu);font-size:12px}.kpi b{display:block;font-size:26px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:130px}.row.st{align-items:stretch}
label{font-size:12px;color:var(--mu);display:block;margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--s2);color:var(--tx);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:70px}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600}
button:hover{filter:brightness(1.1)}button.g{background:#16c784;color:#032}button.r{background:var(--r)}button.o{background:var(--s3)}button.sm{padding:6px 10px;font-size:12px}button:disabled{opacity:.4}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:600;text-align:left;font-size:12px;white-space:nowrap}td,th{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:#ffffff05}
.st{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.approved,.paid,.upcoming,.resolved{background:#2ee59d22;color:var(--g)}.pending,.open,.ongoing{background:#ffc23322;color:var(--gold)}.rejected,.failed,.closed,.banned{background:#ff4d6d22;color:var(--r)}.resulted{background:#00b8ff22;color:var(--b)}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs div{padding:8px 14px;border-radius:10px;background:var(--s1);border:1px solid var(--line);font-size:13px;cursor:pointer;color:var(--mu)}.tabs div.on{background:var(--ac);color:#fff;border-color:transparent}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.modal .box{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:18px;right:18px;background:#0c1428;border:1px solid var(--line);padding:12px 18px;border-radius:12px;z-index:99;box-shadow:0 10px 30px #0008}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 0}.sw i{width:44px;height:24px;border-radius:99px;background:var(--s3);position:relative;transition:.2s;flex:none}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on i{background:var(--g)}.sw.on i:after{left:23px}
.msg{padding:9px 12px;border-radius:12px;margin-bottom:6px;max-width:80%;font-size:13px}.msg.user{background:var(--s3)}.msg.admin{background:var(--ac);margin-left:auto}
.log{padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;justify-content:space-between;gap:10px}.log small{color:var(--mu);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.ed{display:flex;gap:8px;margin-bottom:6px;align-items:center}.ed input{flex:1}
.login{max-width:360px;margin:12vh auto;width:100%;padding:0 16px}
.mt{display:none;position:fixed;top:0;left:0;right:0;background:#0c1428;padding:10px 12px;z-index:20;border-bottom:1px solid var(--line);align-items:center;gap:10px}
@media(max-width:820px){body{display:block}aside{position:fixed;left:-250px;top:0;z-index:40;transition:.25s;width:230px}aside.open{left:0}.mt{display:flex}main{padding:70px 12px 60px}}
.imf{display:flex;gap:8px;align-items:center}.imf img{width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--s2);flex:none}.imf>input{flex:1}
label.up{cursor:pointer;background:var(--s3);padding:9px 12px;border-radius:10px;font-size:12px;margin:0;white-space:nowrap;color:var(--tx);display:inline-block}
.seatT td{padding:7px 8px}.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px}.chk input{width:auto}

/* premium orange-dark skin */
body{background:radial-gradient(700px 400px at 100% -100px,#ff7a1a22,transparent 70%),#0a0a0e}
aside{background:#0e0e13;border-right:1px solid #ff7a1a22}aside h2{font-size:19px;font-weight:800;color:#ff9a3c;letter-spacing:.5px}
aside a{border-radius:14px;font-weight:500}aside a.on{background:linear-gradient(135deg,#ff9a3c,#ff5a0a);color:#1a0b00;font-weight:700;box-shadow:0 8px 22px #ff7a1a40}
.ni{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card,.kpi{border-radius:20px;background:#14141a}.kpi b{color:#ffb347}
button{background:linear-gradient(135deg,#ff9a3c,#ff5a0a);color:#1a0b00;border-radius:12px}button.g{background:linear-gradient(135deg,#34d399,#10b981);color:#04281a}button.r{color:#fff}button.o{background:#272732;color:#f5f3ef}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 4px #ff7a1a1f}.tabs div.on{background:linear-gradient(135deg,#ff9a3c,#ff5a0a);color:#1a0b00;font-weight:700}
.imf{background:#1c1c24;border:1px dashed #ff7a1a55;border-radius:14px;padding:8px}.imf img{width:56px;height:56px;border-radius:10px}.imf input{border:0;background:transparent}label.up{background:linear-gradient(135deg,#ff9a3c,#ff5a0a);color:#1a0b00;font-weight:700}
.msg.admin{color:#1a0b00}.login .card{padding:26px;border:1px solid #ff7a1a44}

/* v2 admin: high-end orange-dark */
*{font-family:'Outfit',system-ui,sans-serif!important}
:root{--ac:#ff7a1a;--bg:#09090d;--s1:#13131a;--s2:#1b1b24;--s3:#262631}
aside{width:244px;padding:18px 12px}
aside h2{padding:6px 10px 20px;font-size:20px}
aside h2:before{content:"";width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ff9a3c,#ff5a0a);box-shadow:0 8px 20px #ff7a1a55;flex:none}
aside a{padding:12px 14px;margin-bottom:3px;transition:.2s}aside a:hover{background:#ffffff0a;color:#f5f3ef}
aside a b{background:#ff7a1a;color:#1a0b00;font-weight:800}
main{padding:26px 28px 70px;max-width:1280px}
.top{margin-bottom:22px}.top h1{font-size:28px;font-weight:800;letter-spacing:.2px}
.card{border:1px solid #ffffff12;box-shadow:0 12px 30px #0006;padding:18px}.card h3{font-size:16px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}.card h3:before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(#ff9a3c,#ff5a0a)}
.grid{gap:14px}.kpi{position:relative;overflow:hidden;padding:18px 18px 18px 22px;border:1px solid #ffffff12;box-shadow:0 10px 26px #0006}
.kpi:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(#ff9a3c,#ff5a0a)}
.kpi:after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(#ff7a1a26,transparent 70%)}
.kpi small{font-size:13px;letter-spacing:.3px}.kpi b{font-size:30px;font-weight:800}
table{border-collapse:separate;border-spacing:0}th{text-transform:uppercase;letter-spacing:.8px;font-size:11px;padding:12px 10px;background:#ffffff06}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 10px}tr:hover td{background:#ff7a1a0a}
.st{padding:4px 12px;letter-spacing:.3px;text-transform:capitalize}
input,select,textarea{background:#1b1b24;border:1.5px solid #ffffff12;border-radius:12px;padding:11px 14px}
button{padding:10px 16px;border-radius:12px;box-shadow:0 6px 16px #ff7a1a2e;transition:.15s}button:active{transform:scale(.97)}
button.o,button.r,button.g{box-shadow:none}button.sm{padding:7px 12px}
.tabs div{border-radius:99px;padding:9px 18px;font-weight:600;transition:.2s}.tabs div:hover{border-color:#ff7a1a66}
.modal{background:#000c;backdrop-filter:blur(6px)}.modal .box{border:1px solid #ff7a1a44;border-radius:24px;box-shadow:0 30px 80px #000}
.toast{background:#1b1b24;border:1px solid #ff7a1a77;border-radius:14px;font-weight:600}
.sw.on i{background:#ff7a1a}
.login{margin:10vh auto}.login .card{border-radius:26px;padding:30px;background:radial-gradient(300px 200px at 50% -20px,#ff7a1a26,transparent 70%),#13131a}.login h2{font-size:26px;font-weight:800}
.mt{background:#0e0e13f2;backdrop-filter:blur(14px);border-bottom:1px solid #ff7a1a33;padding:12px 14px}.mt b{font-size:17px}
.log{padding:12px 0}::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#ff7a1a55;border-radius:8px}
@media(max-width:820px){main{padding:74px 12px 60px}.top h1{font-size:23px}.kpi b{font-size:24px}}
</style></head><body>
<div id="app" style="width:100%"></div>
<script>
const $=s=>document.querySelector(s);
let T=null;try{T=localStorage.getItem('atk')}catch{}
let page='dash',ST={},F={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN');
const fT=t=>t?new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const lt=t=>{const d=new Date(t-new Date().getTimezoneOffset()*6e4);return d.toISOString().slice(0,16)};
async function api(p,b,m){
  const r=await fetch('/api/admin'+p,{method:m||(b?'POST':'GET'),headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status==401||r.status==403){T=null;try{localStorage.removeItem('atk')}catch{}login()}throw new Error(j.error||'Error')}return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function modal(h,w){closeM();const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box" ${w?`style="max-width:${w}px"`:''}>${h}</div>`;d.addEventListener('mousedown',e=>{if(e.target==d)closeM()});document.body.appendChild(d)}
function closeM(){document.querySelectorAll('.modal').forEach(x=>x.remove())}
async function run(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(e.message)}}
function csv(name,rows){const c=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=name;a.click()}
function copyT(t){try{navigator.clipboard.writeText(t);toast('Copied')}catch{toast(t)}}
/* image upload */
const imgF=(id,l,v)=>`<label>${l}</label><div class="imf"><img id="${id}_p" src="${esc(v||'')}" style="${v?'':'display:none'}"><input id="${id}" value="${esc(v||'')}" placeholder="Image URL ya upload karo" oninput="pv('${id}')"><label class="up">⬆ Upload<input type="file" accept="image/*" hidden onchange="upImg(this,'${id}')"></label></div>`;
function pv(id){const i=$('#'+id),p=$('#'+id+'_p');p.src=i.value;p.style.display=i.value?'':'none'}
async function upImg(f,id){const file=f.files[0];if(!file)return;try{toast('Uploading…');const url=await uploadFile(file);$('#'+id).value=url;pv(id);toast('Uploaded ✓')}catch(e){toast(e.message)}f.value=''}
function uploadFile(file,max=1280){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let d=c.toDataURL(file.type=='image/png'?'image/png':'image/jpeg',.82);if(d.length>800000)d=c.toDataURL('image/jpeg',.7);api('/upload',{data:d}).then(j=>ok(j.url)).catch(no)};im.onerror=()=>no(new Error('Image padh nahi payi'));im.src=r.result};r.readAsDataURL(file)})}
const banRow=(img='',link='')=>{const id='b'+Math.random().toString(36).slice(2,8);return `<div class="ed"><div class="imf" style="flex:1"><img id="${id}_p" src="${esc(img)}" style="${img?'':'display:none'}"><input class="bi" id="${id}" value="${esc(img)}" placeholder="Banner URL / upload" oninput="pv('${id}')"><label class="up">⬆ Upload<input type="file" accept="image/*" hidden onchange="upImg(this,'${id}')"></label></div><input class="bl" placeholder="Link (optional)" value="${esc(link)}"><button class="sm r" onclick="this.parentNode.remove()">✕</button></div>`};
function addBan(){const d=document.createElement('div');d.innerHTML=banRow();document.getElementById('bans').appendChild(d.firstChild)}
const seatLbl=(s,p,z)=>z>1?`Team ${s} · ${'ABCD'[p]}`:`Slot ${s}`;

function login(){$('#app').innerHTML=`<div class="login"><div class="card"><h2 style="margin-bottom:6px;color:#ff9a3c">Admin Login</h2><p style="color:var(--mu);font-size:13px;margin-bottom:10px">Sirf owner ke liye</p><label>Username</label><input id="u"><label>Password</label><input id="p" type="password" onkeydown="if(event.key=='Enter')doLogin()"><button style="width:100%;margin-top:14px;padding:12px" onclick="doLogin()">Login</button></div></div>`}
async function doLogin(){try{const r=await api('/login',{username:$('#u').value,password:$('#p').value});T=r.token;try{localStorage.setItem('atk',T)}catch{}show()}catch(e){toast(e.message)}}

/* admin alerts: match full -> push + toast */
const b64u=s=>{const r=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),a=atob(r);return Uint8Array.from([...a].map(c=>c.charCodeAt(0)))};
async function enableAlerts(){try{
  if(!('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window))return toast('Is browser me push support nahi hai');
  if(await Notification.requestPermission()!=='granted')return toast('Notification permission allow karo');
  const reg=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;
  const k=await(await fetch('/api/push/key')).json();if(!k.key)return toast('Server par push ready nahi hai');
  let sub=await reg.pushManager.getSubscription();
  if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.key)});
  await api('/push/subscribe',{sub:sub.toJSON()});toast('Admin alerts ON ✓')}catch(e){toast(e.message)}}
let seenAl=null;
async function pollAlerts(){if(!T)return;try{const a=await api('/alerts');if(seenAl===null){seenAl=a[0]?a[0].id:'';return}const nw=[];for(const x of a){if(x.id===seenAl)break;nw.push(x)}if(a[0])seenAl=a[0].id;nw.reverse().forEach(x=>toast(x.title))}catch{}}
setInterval(pollAlerts,30000);
const IP={dash:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',matches:'<path d="M14 4l6 6-9 9-4-1-1-4zM5 19l3-3"/>',games:'<rect x="3" y="7" width="18" height="11" rx="4"/><path d="M8 10v5M5.500 12.500h5M16 11.500h.01M18 14h.01"/>',users:'<circle cx="9" cy="8" r="3.500"/><path d="M2.500 20c0-3.500 3-5.500 6.500-5.500s6.500 2 6.500 5.500M16 4.500a3.500 3.500 0 0 1 0 7M18 15c2.200.6 3.500 2.300 3.500 5"/>',wd:'<path d="M12 20V6M6 12l6-6 6 6"/>',dep:'<path d="M12 4v14M6 12l6 6 6-6"/>',promo:'<path d="M3 12l9-9h8v8l-9 9zM15 7.500h.01"/>',tickets:'<path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H5a1 1 0 0 1-1-1zM20 14h-3v5h2a1 1 0 0 0 1-1z"/>',notice:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',logs:'<path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/>',app:'<path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/>',out:'<path d="M12 3v9M6.300 6.300a8 8 0 1 0 11.400 0"/>'};
const ic=k=>`<svg class="ni" viewBox="0 0 24 24">${IP[k]}</svg>`;
const NAV=[['dash','dash','Dashboard'],['matches','matches','Matches'],['games','games','Games'],['users','users','Users'],['wd','wd','Withdrawals','pendingWithdraw'],['dep','dep','Deposits','pendingDeposits'],['promo','promo','Promo Codes'],['tickets','tickets','Support','openTickets'],['notice','notice','Notifications'],['settings','settings','Settings & Images'],['logs','logs','Activity Log']];
function shell(title,body,actions){
  $('#app').innerHTML=`<div class="mt"><button class="o" onclick="document.querySelector('aside').classList.toggle('open')">☰</button><b>${esc(title)}</b></div>
  <div style="display:flex"><aside><h2>WolfClash Admin</h2>${NAV.map(n=>`<a class="${page==n[0]?'on':''}" onclick="page='${n[0]}';F={};show()">${ic(n[1])} ${n[2]}${n[3]&&ST[n[3]]?`<b>${ST[n[3]]}</b>`:''}</a>`).join('')}<a onclick="enableAlerts()">${ic('notice')} Enable match alerts</a><a onclick="window.open('/','_blank')">${ic('app')} Open app</a><a onclick="try{localStorage.removeItem('atk')}catch{};location.reload()" style="color:var(--r)">${ic('out')} Logout</a></aside>
  <main><div class="top"><h1>${esc(title)}</h1>${actions||''}</div>${body}</main></div>`}

async function show(){
  if(!T)return login();
  try{ST=await api('/stats')}catch{return}
  try{await P[page]()}catch(e){toast(e.message)}}

const P={
async dash(){
  const [c]=await Promise.all([api('/chart')]);const s=ST;
  const mx=Math.max(1,...c.days.flatMap(d=>[d.dep,d.wd]));const W=560,H=190,bw=18,gap=(W-40)/7;
  const bars=c.days.map((d,i)=>{const x=30+i*gap,h1=d.dep/mx*140,h2=d.wd/mx*140;return `<rect x="${x}" y="${160-h1}" width="${bw}" height="${h1}" rx="4" fill="#2ee59d"><title>Deposit ${d.dep}</title></rect><rect x="${x+bw+3}" y="${160-h2}" width="${bw}" height="${h2}" rx="4" fill="#ff4d6d"><title>Withdraw ${d.wd}</title></rect><text x="${x+bw}" y="180" fill="#8fa0c8" font-size="11" text-anchor="middle">${d.day}</text><text x="${x+bw}" y="${150-Math.max(h1,h2)}" fill="#8fa0c8" font-size="10" text-anchor="middle">${d.users?'+'+d.users:''}</text>`}).join('');
  const profit=s.depositTotal-s.withdrawTotal;
  shell('Dashboard',`<div class="grid">
  <div class="kpi"><small>Total users</small><b>${s.users}</b></div><div class="kpi"><small>Banned</small><b>${s.banned}</b></div><div class="kpi"><small>Matches</small><b>${s.matches}</b></div>
  <div class="kpi"><small>Total deposits</small><b style="color:var(--g)">${rs(s.depositTotal)}</b></div><div class="kpi"><small>Paid out</small><b style="color:var(--r)">${rs(s.withdrawTotal)}</b></div><div class="kpi"><small>Net (dep − payout)</small><b>${rs(profit)}</b></div>
  <div class="kpi"><small>Pending withdrawals</small><b style="color:var(--gold)">${s.pendingWithdraw}</b></div><div class="kpi"><small>Open tickets</small><b>${s.openTickets}</b></div><div class="kpi"><small>User wallets total (liability)</small><b>${rs(s.liabilities)}</b></div></div>

function addRow(id,h){const d=document.createElement('div');d.className='ed';d.innerHTML=h.replace(/&quot;/g,'"')+'<button class="sm r" onclick="this.parentNode.remove()">✕</button>';document.getElementById(id).appendChild(d)}
async function saveSet(){
  const o={};['appName','logo','telegram','whatsapp','contact','announcement','maintenanceMsg','rules','about','faq','terms','privacy','minDeposit','maxDeposit','minWithdraw','withdrawFee','maxWithdrawPerDay','signupBonus','referrerBonus','referralMinEntry','dailyReward'].forEach(k=>{o[k]=$('#s_'+k).value});
  o.maintenance=$('#s_mnt').classList.contains('on');
  o.depositBonus=[...document.querySelectorAll('#tiers .ed')].map(r=>{const i=r.querySelectorAll('input');return{dep:+i[0].value,bonus:+i[1].value}}).filter(x=>x.dep>0);
  o.images={loginBg:$('#s_img_loginBg').value.trim(),addCash:$('#s_img_addCash').value.trim(),refer:$('#s_img_refer').value.trim(),promo:$('#s_img_promo').value.trim()};
  o.banners=[...document.querySelectorAll('#bans .ed')].map(r=>({img:r.querySelector('.bi').value.trim(),link:r.querySelector('.bl').value.trim()})).filter(x=>x.img);
  run(()=>api('/settings',o),'Settings saved ✓')}

 const res=m.result&&m.result.length?`<div class="card"><h3>Result</h3><table><tr><th>Rank</th><th>IGN</th><th>User</th><th>Kills</th><th>Prize</th></tr>${m.result.map(r=>`<tr><td>#${r.rank||'-'}</td><td>${esc(r.ign||'')}</td><td>@${esc(r.username)}</td><td>${r.kills}</td><td>${rs(r.prize)}</td></tr>`).join('')}</table></div>`:'';
 modal(`<h3>${esc(m.title)} <span class="st ${m.status}">${m.status}</span> <small style="color:var(--mu)">${m.players.length}/${m.slots*sz} joined</small></h3>
 ${m.status!='resulted'?`<div class="card" style="margin-top:12px"><h3>Room ID & Password</h3><div class="row"><div><label>Room ID</label><input id="vr" value="${esc(m.roomId||'')}"></div><div><label>Password</label><input id="vp" value="${esc(m.roomPass||'')}"></div></div><label class="chk"><input type="checkbox" id="vn" checked> Players ko notification bhejo</label><button class="g" style="margin-top:10px" onclick="saveRoom('${id}')">Update room</button></div>
 <div class="card"><h3>Message to all players</h3><input id="vt" placeholder="Title" value="${esc(m.title)}"><textarea id="vm" placeholder="Message likho…" style="margin-top:6px"></textarea><button class="g" style="margin-top:8px" onclick="msgP('${id}')">Send to all</button></div>`:''}
 ${res}<div class="card"><h3>Slots & players</h3><table class="seatT"><tr><th>Slot</th><th>In-game name</th><th>App username</th><th></th></tr>${rows}</table></div>
 <div style="display:flex;gap:8px"><button class="o" onclick="copyT(_m.find(x=>x.id=='${id}').players.map(p=>seatLbl(p.slot,p.pos,${sz})+' - '+p.ign+' (@'+p.username+')').join('\\n'))">Copy list</button><button class="o" onclick="closeM()">Close</button></div>`,720)}
function saveRoom(id){run(async()=>{await api(`/match/${id}/room`,{roomId:$('#vr').value,roomPass:$('#vp').value,notify:$('#vn').checked});reV(id)},'Room updated ✓')}
function msgP(id,uid){const b=uid?prompt('Is player ko message:'):$('#vm').value;if(!b)return toast('Message likho');run(async()=>{const r=await api(`/match/${id}/message`,{uid,title:uid?'Message from admin':$('#vt').value,body:b});toast('Sent to '+r.sent+' player(s) ✓')})}
function mvP(id,uid){const v=prompt('Naya slot? Solo: 5  •  Duo/Squad: 3-B');const q=v&&v.trim().match(/^(\d+)\s*-?\s*([A-Da-d])?$/);if(!q)return;run(async()=>{await api(`/match/${id}/move`,{uid,slot:+q[1],pos:q[2]?'ABCD'.indexOf(q[2].toUpperCase()):0});reV(id)},'Moved ✓')}
function kickP(id,uid){if(confirm('Player ko hata kar fee refund karu?'))run(async()=>{await api(`/match/${id}/kick`,{uid});reV(id)},'Removed & refunded')}
function resultUI(id){const m=_m.find(x=>x.id==id),sz=m.size||1,ps=m.players.slice().sort((a,b)=>a.slot-b.slot||a.pos-b.pos);window._rm=m;
  modal(`<h3>Result — ${esc(m.title)}</h3><p style="color:var(--mu);font-size:13px;margin:4px 0 12px">Rank daalo → rank prize auto-fill hoga${(m.rankPrizes||[]).length?'':' (rank prize table set nahi hai, manually daalo)'}. Kill prize ₹${m.perKill}/kill apne aap judega.${sz>1?' Team ka rank ek member me daalo, baaki sync ho jayega.':''}</p><div style="overflow:auto"><table id="resT"><tr><th>Slot</th><th>Player</th><th>Rank</th><th>Kills</th><th>Rank prize ₹</th><th>Total</th></tr>${ps.map(p=>`<tr data-s="${p.slot}" data-u="${p.uid}"><td>${seatLbl(p.slot,p.pos,sz)}</td><td><b>${esc(p.ign)}</b><br><small style="color:var(--mu)">@${esc(p.username)}</small></td><td><input class="rr" type="number" min="0" style="width:64px" oninput="rRank(this)"></td><td><input class="rk" type="number" min="0" value="0" style="width:64px" oninput="rTot(this)"></td><td><input class="rp" type="number" min="0" value="0" style="width:84px" oninput="this.dataset.man=1;rTot(this)"></td><td class="rt">₹0</td></tr>`).join('')||'<tr><td colspan="6">No players</td></tr>'}</table></div><div style="margin-top:14px;display:flex;gap:8px"><button class="g" onclick="subRes('${id}')">Submit & credit winnings</button><button class="o" onclick="closeM()">Cancel</button></div>`,820)}
function rTot(el){const tr=el.closest('tr'),m=window._rm;tr.querySelector('.rt').textContent=rs((+tr.querySelector('.rp').value||0)+(+tr.querySelector('.rk').value||0)*(m.perKill||0))}
function rRank(el){const m=window._rm,sz=m.size||1,tr=el.closest('tr'),rk=+el.value||0;document.querySelectorAll('#resT tr[data-s]').forEach(r=>{if(r!=tr&&!(sz>1&&r.dataset.s==tr.dataset.s))return;const ri=r.querySelector('.rr'),rp=r.querySelector('.rp');ri.value=rk||'';if(!rp.dataset.man){const b=(m.rankPrizes||[])[rk-1]||0;rp.value=Math.round((m.splitPrize?b/sz:b)*100)/100}rTot(ri)})}
function subRes(id){const results=[...document.querySelectorAll('#resT tr[data-u]')].map(r=>({uid:r.dataset.u,rank:r.querySelector('.rr').value||0,kills:r.querySelector('.rk').value||0,prize:r.querySelector('.rp').value||0}));if(!confirm('Winnings credit kar du? Ye undo nahi hoga.'))return;run(async()=>{await api(`/match/${id}/result`,{results});closeM();show()},'Result published ✓')}

function gameForm(id){const g=id?_g.find(x=>x.id==id):{};modal(`<h3>${id?'Edit':'Add'} game</h3><label>Name</label><input id="gn" value="${esc(g.name||'')}">${imgF('gi','Game image',g.image)}<div style="margin-top:14px;display:flex;gap:8px"><button class="g" onclick="saveGame(${id?`'${id}'`:'null'})">Save</button><button class="o" onclick="closeM()">Cancel</button></div>`,420)}
function saveGame(id){run(async()=>{await api('/game',{id,name:$('#gn').value,image:$('#gi').value});closeM();show()},'Saved ✓')}
function delGame(id){if(confirm('Delete game?'))run(async()=>{await api('/game/'+id,null,'DELETE');show()})}

async function userDetail(id){
  const d=await api(`/user/${id}/detail`);
  modal(`<h3>${esc(d.username)} ${d.banned?'<span class="st banned">banned</span>':''}</h3><div class="grid" style="margin-top:12px"><div class="kpi"><small>Deposit</small><b>${d.dep}</b></div><div class="kpi"><small>Winning</small><b>${d.win}</b></div><div class="kpi"><small>Bonus</small><b>${d.bonus}</b></div><div class="kpi"><small>Matches / Kills</small><b>${d.matches} / ${d.kills}</b></div><div class="kpi"><small>Earning</small><b>${d.earning}</b></div></div>
  <p style="font-size:13px;color:var(--mu)">Referred by: <b style="color:var(--tx)">${esc(d.referredBy||'-')}</b> • Referrals (${d.referrals.length}): ${d.referrals.map(esc).join(', ')||'-'}</p>
  <div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="o" onclick="adj('${id}')">± Balance</button><button class="o" onclick="resetPw('${id}')">Reset password</button><button class="${d.banned?'g':'r'}" onclick="uact('${id}','${d.banned?'unban':'ban'}');closeM()">${d.banned?'Unban':'Ban'}</button></div>
  <h3 style="margin-top:14px">Recent transactions</h3><table>${d.txns.map(t=>`<tr><td>${fT(t.at)}</td><td>${esc(t.note)}</td><td style="color:${t.type=='debit'?'var(--r)':'var(--g)'}">${t.type=='debit'?'−':'+'}${t.amt}</td><td>${t.wallet}</td></tr>`).join('')||'<tr><td>None</td></tr>'}</table>
  <button class="o" style="margin-top:14px" onclick="closeM()">Close</button>`,760)}
function adj(id){modal(`<h3>Adjust balance</h3><label>Wallet</label><select id="aw"><option value="dep">Deposit</option><option value="win">Winning</option><option value="bonus">Bonus</option></select><label>Action</label><select id="aa"><option value="add">Add (credit)</option><option value="deduct">Deduct (debit)</option></select><label>Amount</label><input id="am" type="number"><div style="margin-top:14px;display:flex;gap:8px"><button class="g" onclick="doAdj('${id}')">Apply</button><button class="o" onclick="closeM()">Cancel</button></div>`,400)}
function notifyU(id){modal(`<h3>Send notification</h3><label>Title</label><input id="nut"><label>Message</label><textarea id="nub"></textarea><div style="margin-top:14px;display:flex;gap:8px"><button class="g" onclick="doNotifyU('${id}')">Send</button><button class="o" onclick="closeM()">Cancel</button></div>`,400)}
function doNotifyU(id){run(async()=>{const r=await api('/user/'+id+'/notify',{title:$('#nut').value,body:$('#nub').value});closeM();toast(r.devices?'Sent ✓ (phone par bhi gaya)':'Saved ✓ (user ne phone notification ON nahi ki, app me dikhega)')})}
function doAdj(id){run(async()=>{await api('/user/'+id,{action:$('#aa').value,wallet:$('#aw').value,amount:$('#am').value,reason:prompt('Reason for this adjustment (required, saved in ledger)')||''});closeM();show()},'Balance updated ✓')}
function uact(id,a){run(async()=>{await api('/user/'+id,{action:a});show()},a+' done')}
function resetPw(id){const p=prompt('New password (min 6 chars)');if(p)run(()=>api(`/user/${id}/password`,{password:p}),'Password reset ✓')}
function wact(id,a){if(confirm(a=='approve'?'UPI pe payment kar diya? Mark paid?':'Reject karke paisa wapas karu?'))run(async()=>{await api('/withdrawal/'+id,{action:a});show()},'Done ✓')}
function recheck(id){run(async()=>{const r=await api(`/deposit/${id}/recheck`,{});toast('Gateway status: '+r.status);show()})}
function manualDep(id){if(confirm('Payment gateway me confirm kar liya? Manually approve?'))run(async()=>{await api(`/deposit/${id}/approve`,{});show()},'Approved ✓')}
function addPromo(){run(async()=>{await api('/promo',{code:$('#pc').value,bonus:$('#pb').value,maxUses:$('#pm').value,expires:$('#pe').value});show()},'Code created ✓')}
function delPromo(c){if(confirm('Delete '+c+'?'))run(async()=>{await api('/promo/'+encodeURIComponent(c),null,'DELETE');show()})}
function ticketUI(id){const t=_t.find(x=>x.id==id);modal(`<h3>${esc(t.subject)} <small style="color:var(--mu)">— ${esc(t.username)}</small></h3><div style="margin:14px 0;max-height:46vh;overflow:auto">${t.msgs.map(m=>`<div class="msg ${m.from}">${esc(m.text)}<br><small style="opacity:.6">${fT(m.at)}</small></div>`).join('')}</div><input id="tr" placeholder="Reply…"><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="g" onclick="tReply('${id}')">Send reply</button><button class="o" onclick="tClose('${id}','${t.status=='open'?'closed':'open'}')">${t.status=='open'?'Close ticket':'Reopen'}</button><button class="o" onclick="closeM()">Back</button></div>`,560)}
function tReply(id){run(async()=>{await api('/ticket/'+id,{text:$('#tr').value});closeM();show()},'Sent ✓')}
function tClose(id,s){run(async()=>{await api('/ticket/'+id,{status:s});closeM();show()})}
function sendN(){run(async()=>{const r=await api('/notice',{title:$('#nt').value,body:$('#nb').value,image:$('#ni').value});show();toast('Sent ✓ ('+r.devices+' devices)')})}
function delN(id){run(async()=>{await api('/notice/'+id,null,'DELETE');show()})}
show();
</script></body></html>
