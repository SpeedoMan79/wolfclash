<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Arena Battle</title>
<style>
:root{--bg:#0a1a33;--card:#1e2540;--pri:#4361ee;--gold:#f5b50a;--g:#22c55e;--r:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Roboto,sans-serif}
body{background:#0b1730;color:#fff;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:80px}
header{background:linear-gradient(#0a4a7a,#06284d);padding:14px 16px;border-radius:0 0 24px 24px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;flex:1}header .back{font-size:24px;cursor:pointer}
.coin{background:#0003;border:1px solid #fff5;border-radius:20px;padding:4px 12px;font-weight:700}
.wrap{padding:14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.light{background:#fff;color:#111;border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334;background:#fff;color:#111;font-size:16px;margin:6px 0}
button,.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;width:100%;cursor:pointer;margin-top:6px}
button.g{background:var(--g)}button.r{background:var(--r)}button:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#06284d;display:flex;border-radius:20px 20px 0 0;z-index:6}
nav div{flex:1;text-align:center;padding:10px 0;font-size:12px;cursor:pointer;opacity:.7}nav div.on{opacity:1;border-top:3px solid #fff}nav b{display:block;font-size:20px}
.ann{background:#2a3350;border-radius:8px;padding:10px;font-size:14px;margin-bottom:12px}
.bonus{background:linear-gradient(135deg,#7a0010,#d0102a);border-radius:14px;padding:12px;margin-bottom:12px;text-align:center}
.bonus table{width:100%;margin-top:6px}.bonus td,.bonus th{padding:4px;font-size:15px}.bonus td{background:#b0001f;border:1px solid #f33}
.row3{display:flex;gap:10px}.row3>div{flex:1;background:#fff;color:#111;border-radius:12px;padding:16px 6px;text-align:center;font-weight:600;cursor:pointer}
.row3 span{font-size:26px;display:block}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{background:#1e2540;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #2ad}
.game .im{height:90px;background:linear-gradient(135deg,#c2410c,#7c2d12);display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center;padding:6px;background-size:cover}
.game .t{padding:8px;font-size:13px;display:flex;justify-content:space-between}.game .t i{color:var(--g);font-style:normal;font-weight:700}
.tabs{display:flex;background:#06284d}.tabs div{flex:1;text-align:center;padding:12px;cursor:pointer;opacity:.7}.tabs div.on{opacity:1;border-bottom:3px solid #fff}
.m .im{height:120px;border-radius:10px;background:linear-gradient(135deg,#f97316,#b91c1c);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;background-size:cover;background-position:center;margin-bottom:8px}
.m h3{font-size:15px;color:#223}.m .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center;font-size:12px;color:#555}.m .g3 b{display:block;color:#111;font-size:15px}
.bar{height:5px;background:#eee;border-radius:3px;margin:6px 0}.bar i{display:block;height:5px;background:var(--r);border-radius:3px}
.m .foot{display:flex;align-items:center;gap:10px;justify-content:space-between}.m .foot button{width:auto;padding:10px 22px;margin:0}
.list .it{display:flex;padding:14px;background:var(--card);border-radius:10px;margin-bottom:8px;justify-content:space-between}
.mi{display:flex;align-items:center;gap:12px;background:#fff;color:#223;border-radius:12px;padding:16px;margin-bottom:10px;cursor:pointer}
.mi span{font-size:20px}.mi i{margin-left:auto;color:#888;font-style:normal}
.prof{text-align:center;color:#1976d2}.prof .av{width:90px;height:90px;border-radius:50%;background:#3b82f6;border:6px solid #facc15;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff}
.stats{display:flex;text-align:center;color:#1976d2;font-weight:700;font-size:22px}.stats>div{flex:1}.stats small{display:block;color:#666;font-size:12px;font-weight:400}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}.modal .box{background:#fff;color:#111;border-radius:14px;padding:18px;width:100%;max-width:400px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:20px;z-index:50;border:1px solid #fff5}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.chips div{background:#dbe7ff;color:#111;padding:12px;text-align:center;border-radius:10px;cursor:pointer}
.hist{background:#fff;color:#111;border-radius:12px;padding:10px;margin-bottom:10px;font-size:14px}.hist div{display:flex;justify-content:space-between;padding:6px;background:#f6f5f4;margin-bottom:4px;border-radius:6px}
.auth{padding:30px 20px;text-align:center}.auth h1{margin-bottom:20px}.auth a{color:#7aa2ff;cursor:pointer}
.ref{background:#4a00b8;border-radius:20px;padding:20px;text-align:center;line-height:1.5}.code{background:#d8d6dc;color:#111;border-radius:14px;padding:14px;display:flex;justify-content:space-between;margin:14px 0;font-size:20px;border:2px dashed #fff}
.sh{display:flex;gap:8px}.sh button{margin:0}
</style></head><body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);let S={},U=null,view='home',stack=[];
const tk=()=>localStorage.getItem('tk');
async function api(p,o={}){const r=await fetch('/api'+p,{method:o.body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tk()||'')},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&tk()){localStorage.removeItem('tk');boot()}throw new Error(j.error||'Error')}return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function head(t,back){return `<header>${back?'<span class="back" onclick="goBack()">‹</span>':''}<h1>${t}</h1></header>`}
function go(v,p){stack.push([view,window.P]);view=v;window.P=p;render()}
function goBack(){const s=stack.pop();if(s){view=s[0];window.P=s[1]}else view='home';render()}
function tab(v){stack=[];view=v;window.P=null;render()}
function navbar(){const t=[['earn','🎁','Earn'],['board','🏆','Leaderboard'],['home','🏠','Home'],['menu','⋯','Menu']];return `<nav>${t.map(x=>`<div class="${view==x[0]?'on':''}" onclick="tab('${x[0]}')"><b>${x[1]}</b>${x[2]}</div>`).join('')}</nav>`}
async function boot(){S=await api('/settings');document.title=S.appName;if(!tk())return authView();try{U=await api('/me')}catch{return authView()}render();const p=new URLSearchParams(location.search).get('paid');if(p){history.replaceState({},'','/');checkPay(p)}}
function authView(signup){const ref=new URLSearchParams(location.search).get('ref')||'';$('#app').innerHTML=`<div class="auth"><h1>${esc(S.appName)}</h1><input id="u" placeholder="Username" autocapitalize="none"><input id="p" type="password" placeholder="Password">${signup?`<input id="rf" placeholder="Referral code (optional)" value="${esc(ref)}">`:''}<button onclick="doAuth(${!!signup})">${signup?'Sign up':'Login'}</button><p style="margin-top:16px">${signup?'Have account? <a onclick="authView()">Login</a>':'New here? <a onclick="authView(1)">Sign up</a>'}</p></div>`}
async function doAuth(s){try{const r=await api(s?'/signup':'/login',{body:{username:$('#u').value,password:$('#p').value,ref:s?$('#rf').value:''}});localStorage.setItem('tk',r.token);U=r.user;view='home';render()}catch(e){toast(e.message)}}
async function render(){const a=$('#app');
if(view=='home'){const g=await api('/games');a.innerHTML=head(`${esc(U.username)} <span class="coin" style="float:right">🪙 ${U.total}</span>`)+`<div class="wrap"><div class="ann">📢 ${esc(S.announcement)}</div><div class="bonus"><h2>GET YOUR COIN DEPOSIT BONUS</h2><table><tr><th>DEPOSIT</th><th>BONUS</th><th>TOTAL</th></tr>${S.depositBonus.map(b=>`<tr><td>${b.dep}</td><td>${b.bonus}</td><td>${b.dep+b.bonus}</td></tr>`).join('')}</table></div><h2 style="text-align:center;margin:10px">My Matches</h2><div class="row3"><div onclick="go('my',{s:'ongoing'})"><span>🔄</span>Ongoing</div><div onclick="go('my',{s:'upcoming'})"><span>📅</span>Upcoming</div><div onclick="go('my',{s:'resulted'})"><span>✅</span>Completed</div></div><h3 style="margin:18px 0 10px">Esports Games</h3><div class="games">${g.map(x=>`<div class="game" onclick="go('matches',{g:'${x.id}',n:'${esc(x.name)}',s:'upcoming'})"><div class="im" style="${x.image?`background-image:url(${esc(x.image)})`:''}">${x.image?'':esc(x.name)}</div><div class="t">${esc(x.name)}<i>● ${x.count}</i></div></div>`).join('')}</div></div>`+navbar()}
else if(view=='matches'||view=='my'){const p=window.P;const my=view=='my';const m=await api(my?'/my-matches?status='+p.s:`/matches?game=${p.g}&status=${p.s}`);a.innerHTML=head(my?'My Matches':esc(p.n)+' Contests',1)+`<div class="tabs">${['ongoing','upcoming','resulted'].map(s=>`<div class="${p.s==s?'on':''}" onclick="window.P.s='${s}';render()">${s[0].toUpperCase()+s.slice(1)}</div>`).join('')}</div><div class="wrap">${m.map(x=>mcard(x)).join('')||'<p style="text-align:center;opacity:.6;margin-top:30px">No matches</p>'}</div>`}
else if(view=='board'){const r=window.P?.r||'monthly';const l=await api('/leaderboard?range='+r);a.innerHTML=head('Leaderboard')+`<div class="tabs">${['weekly','monthly','fulltime'].map(s=>`<div class="${r==s?'on':''}" onclick="window.P={r:'${s}'};render()">${s[0].toUpperCase()+s.slice(1)}</div>`).join('')}</div><div class="wrap list">${l.map((x,i)=>`<div class="it"><span>${i+1}</span><span style="flex:1;margin-left:30px">${esc(x.name)}</span><b>🪙 ${x.win}</b></div>`).join('')||'<p style="text-align:center;opacity:.6">No data yet</p>'}</div>`+navbar()}
else if(view=='earn'){a.innerHTML=head('Refer & Earn')+`<div class="wrap"><div class="ref"><h1>Refer your friend and Earn</h1><div style="font-size:70px">🎁</div><p>Invite friends using your Referral Code to earn ${S.referrerBonus} Coins in bonus wallet when they join their first paid match (min entry ${S.referralMinEntry}). Your friends also get ${S.signupBonus} Coins as Register Bonus!</p><div class="code"><span>${esc(U.username)}</span><span onclick="navigator.clipboard.writeText('${esc(U.username)}');toast('Copied')">📋</span></div><p>Share your referral code via</p><div class="sh" style="margin-top:10px"><button style="background:#1da1d2" onclick="share('t')">Telegram</button><button style="background:#1877f2" onclick="share('f')">Facebook</button><button style="background:#1fa800" onclick="share('w')">WhatsApp</button></div></div></div>`+navbar()}
else if(view=='menu'){U=await api('/me');a.innerHTML=head('Menu',1)+`<div class="wrap" style="background:#f2f3f5;min-height:90vh"><div class="prof"><div class="av">👤</div><h1>${esc(U.username)}</h1></div><div class="light stats"><div>${U.matches}<small>Matches Played</small></div><div>${U.kills}<small>Total Kills</small></div><div>🪙${U.earning}<small>Total Earning</small></div></div>${[['👤','My Profile','prof'],['👛','My Wallet','wallet'],['📊','My Statistics','prof'],['🏆','Top Players','board'],['🔔','Notifications','notif'],['🎧','Contact Us','page:contact'],['❓','FAQ','page:faq'],['ℹ️','About Us','page:about'],['🔒','Privacy Policy','page:privacy'],['🛡️','Terms & Conditions','page:terms'],['⏻','Logout','out']].map(x=>`<div class="mi" onclick="mi('${x[2]}')"><span>${x[0]}</span>${x[1]}<i>›</i></div>`).join('')}</div>`+navbar()}
else if(view=='prof'){a.innerHTML=head('Profile',1)+`<div class="wrap"><div class="card">Username: <b>${esc(U.username)}</b><br>Matches: ${U.matches}<br>Kills: ${U.kills}<br>Earning: 🪙${U.earning}</div></div>`}
else if(view=='notif'){const n=await api('/notifications');a.innerHTML=head('Notifications',1)+`<div class="wrap">${n.map(x=>`<div class="card"><b>${esc(x.title)}</b><p style="opacity:.8;margin-top:4px">${esc(x.body)}</p></div>`).join('')||'<p style="text-align:center;opacity:.6">Nothing yet</p>'}</div>`}
else if(view=='page'){a.innerHTML=head(window.P.t,1)+`<div class="wrap"><div class="card" style="white-space:pre-wrap">${esc(S[window.P.k])}</div></div>`}
else if(view=='wallet'){const w=await api('/wallet');U=w;a.innerHTML=head('Wallet',1)+`<div class="wrap" style="text-align:center"><h1 style="margin:20px">Total Balance = ${w.total}</h1><p style="color:#4ade80">Deposit Balance: ${w.dep} &nbsp; Win Balance: ${w.win} &nbsp; Bonus: ${w.bonus}</p><button class="g" onclick="go('recharge')" style="margin-top:20px">Buy More</button><button class="r" onclick="go('withdraw')">Withdraw</button><h2 style="margin:24px 0 10px">Wallet history</h2>${w.history.map(h=>`<div class="card" style="font-size:14px">${h.type} ${h.wallet} • Amt: ${h.type=='debit'?'-':'+'}${h.amt} • New bal: ${h.bal}<br><small style="opacity:.7">${new Date(h.at).toLocaleString()} — ${esc(h.note)}</small></div>`).join('')}</div>`}
else if(view=='recharge'){const w=await api('/wallet');a.innerHTML=head('Recharge',1)+`<div class="wrap"><p style="text-align:center">Total Balance<br><b style="font-size:30px">₹ ${w.total}</b></p><div class="light"><h3>Amount</h3><input id="am" type="number" placeholder="₹ ${S.minDeposit} ~ ${S.maxDeposit}"><div class="chips">${[20,50,100,200,500,1000].map(x=>`<div onclick="$('#am').value=${x}">₹${x}</div>`).join('')}</div><button onclick="recharge()">Recharge</button></div><h2 style="text-align:center;margin:16px">Deposits History</h2>${w.deposits.map(d=>`<div class="hist"><div>DepositRequestId<b>${d.id}</b></div><div>Amount<b>₹ ${d.amount}</b></div><div>Status<b>${d.status}</b></div></div>`).join('')}</div>`}
else if(view=='withdraw'){const w=await api('/wallet');a.innerHTML=head('Withdraw',1)+`<div class="wrap"><p style="text-align:center">Win Balance<br><b style="font-size:30px">₹ ${w.win}</b></p><div class="light"><label>Method</label><select id="mt"><option>Paytm</option><option>PhonePe</option><option>GPay</option><option>Other UPI</option></select><label>UPI ID</label><input id="up" placeholder="name@upi"><label>Amount (min ${S.minWithdraw})</label><input id="wa" type="number" value="${S.minWithdraw}"><button class="g" onclick="withdraw()">Withdraw</button></div><h2 style="text-align:center;margin:16px">Withdrawals History</h2>${w.withdrawals.map(d=>`<div class="hist"><div>Request ID<b>${d.id}</b></div><div>Method<b>${esc(d.method)}</b></div><div>UPI<b>${esc(d.upi)}</b></div><div>Amount<b>₹ ${d.amount}</b></div><div>Status<b>${d.status}</b></div></div>`).join('')}</div>`}}
function mcard(x){const full=x.filled>=x.slots,pct=Math.round(x.filled/x.slots*100);return `<div class="light m"><div class="im" style="${x.image?`background-image:url(${esc(x.image)})`:''}">${x.image?'':esc(x.title.slice(0,24))}</div><h3>${esc(x.title)} #${x.id.slice(0,6)}</h3><small>Time : ${new Date(x.time).toLocaleString()}</small><div class="g3"><div>PRIZE POOL<b>🪙 ${x.prize}</b></div><div>PER KILL<b>🪙 ${x.perKill}</b></div><div>ENTRY FEE<b>🪙 ${x.fee}</b></div><div>TYPE<b>${esc(x.type)}</b></div><div>MAP<b>${esc(x.map)}</b></div><div>SLOTS<b>${x.filled}/${x.slots}</b></div></div>${x.room?`<div class="card" style="background:#e8f0ff;color:#111">Room ID: <b>${esc(x.room.id||'Soon')}</b> &nbsp; Pass: <b>${esc(x.room.pass||'Soon')}</b></div>`:''}${x.result?`<div style="font-size:13px;color:#333">${x.result.map(r=>`${esc(r.username)}: ${r.kills} kills, 🪙${r.prize}`).join('<br>')}</div>`:''}${x.status=='upcoming'?`<div class="bar"><i style="width:${pct}%"></i></div><div class="foot"><span style="color:#c00">Only ${x.slots-x.filled} Spot Left</span>${x.joined?'<button class="g" disabled>Joined</button>':full?'<button disabled>Joining Full</button>':`<button onclick="joinM('${x.id}',${x.fee})">Join</button>`}</div>`:''}</div>`}
function joinM(id,fee){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="box"><h3>Join match</h3><p>Entry fee: 🪙 ${fee}</p><input id="ign" placeholder="Your in-game name"><button onclick="confJoin('${id}')">Confirm</button><button class="r" onclick="this.closest('.modal').remove()">Cancel</button></div>`;document.body.appendChild(d)}
async function confJoin(id){try{const r=await api('/join',{body:{matchId:id,ign:$('#ign').value}});U=r.user;document.querySelector('.modal').remove();toast('Joined!');render()}catch(e){toast(e.message)}}
async function recharge(){try{const r=await api('/deposit',{body:{amount:$('#am').value}});location.href=r.url}catch(e){toast(e.message)}}
async function checkPay(id){toast('Checking payment...');for(let i=0;i<6;i++){try{const r=await api('/deposit/check/'+id);if(r.status!='pending'){U=r.user;toast(r.status=='approved'?'Deposit added ✔':'Payment '+r.status);return go('wallet')}}catch{}await new Promise(r=>setTimeout(r,3000))}toast('Payment pending. Wallet check karo.')}
async function withdraw(){try{const r=await api('/withdraw',{body:{method:$('#mt').value,upi:$('#up').value,amount:$('#wa').value}});U=r.user;toast('Request sent');render()}catch(e){toast(e.message)}}
function share(t){const msg=encodeURIComponent(`Join ${S.appName}! Use my referral code ${U.username}: ${location.origin}/?ref=${U.username}`);const u={t:'https://t.me/share/url?url='+location.origin+'&text='+msg,f:'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.origin+'/?ref='+U.username),w:'https://wa.me/?text='+msg}[t];window.open(u,'_blank')}
function mi(k){if(k=='out'){localStorage.removeItem('tk');return boot()}if(k.startsWith('page:')){const m=k.slice(5);return go('page',{k:m,t:{contact:'Contact Us',faq:'FAQ',about:'About Us',privacy:'Privacy Policy',terms:'Terms & Conditions'}[m]})}go(k)}
boot();
</script></body></html>
