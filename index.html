<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B4F82">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>WolfClash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1730;--s1:#122649;--s2:#1B3566;--line:#25437A;--ink:#fff;--mute:#9FB2D6;--acc:#3B82F6;--lime:#86E01E;--cy:#22D3EE;--vio:#5B3DF5;--gold:#FBBF24;--ok:#22C55E;--bad:#F87171;--dk:#0B1A36;--r:16px}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 'Bai Jamjuree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-weight:700}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.pg{animation:pg .28s ease-out}@keyframes pg{from{opacity:0;transform:translateY(8px)}}
.cut{}
/* header (blue, rounded bottom) */
.hd,.sub{background:linear-gradient(#0B4F82,#0A2B58);border-radius:0 0 28px 28px;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;margin-bottom:14px}
.hd{display:flex;align-items:center;gap:10px}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;flex:none;border:2px solid #ffffff55}
.av.lg{width:64px;height:64px;font-size:28px}
.who{flex:1;min-width:0}.who small{display:block;color:#BBD3F2;font-size:12px}
.who b{font-size:20px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{display:flex;align-items:center;gap:6px;border:1px solid #ffffff66;padding:3px 12px 3px 4px;border-radius:99px;font-weight:700;background:#0A2B5899}
.coin svg{width:26px;height:26px}
.bell{position:relative;width:44px;height:44px;display:grid;place-items:center;background:#fff;border-radius:50%;flex:none}
.bell svg{width:22px;fill:#2B50E6}.bell i{position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:#EF4444;border:2px solid #fff}
.sub{display:flex;align-items:center;gap:6px}.sub h1{flex:1;text-align:center;font-size:20px}
.bk{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}.bk svg{width:24px;fill:#fff}
.ann{display:flex;margin:0 16px 14px;background:#33435F;border-radius:12px;overflow:hidden;align-items:stretch}
.ann svg{width:52px;padding:14px;fill:#fff;background:#4A5A78;flex:none}
.ann p{padding:10px 12px;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.slr{position:relative;margin:0 16px}
.trk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:18px;border:2px solid var(--cy)}
.sd{flex:none;width:100%;scroll-snap-align:center;aspect-ratio:16/8.4;background:linear-gradient(135deg,#1E3A8A,#4C1D95) center/cover;display:flex;align-items:flex-end;justify-content:space-between;padding:14px}
.sd h3{font-size:26px;color:#fff}
.more{background:var(--vio);color:#fff;font-weight:600;padding:9px 20px;border-radius:99px}
.dots{position:absolute;right:16px;bottom:14px;display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#ffffffaa;transition:width .3s}.dots i.on{background:#fff;width:20px;border-radius:4px}
.sec{padding:20px 16px 12px;font-size:21px}.sec.c{text-align:center}
.day{padding:0 16px 10px;color:var(--mute);font-size:14px}
/* my matches (white tiles) + games */
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.mt button{background:#fff;color:var(--dk);border-radius:14px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.mt button:active{transform:scale(.96)}
.mt svg{width:44px;height:44px;padding:11px;fill:#fff;border-radius:12px}
.mt b{font-size:22px;line-height:1}.mt small{font-weight:600;font-size:14px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.gc{position:relative;aspect-ratio:4/3.3;border-radius:16px;overflow:hidden;display:flex;align-items:flex-end;text-align:left;background:linear-gradient(135deg,#1E3A8A,#312E81) center/cover;border:2px solid var(--cy);transition:transform .15s}
.gc:active{transform:scale(.97)}
.gl{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px;gap:8px;background:#071229dd}
.gl b{font-size:15px;font-weight:600;line-height:1.2}
.ct{display:flex;align-items:center;gap:6px;color:var(--ok);font-weight:700}.ct i{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.seg{display:flex;gap:4px;margin:0 16px 14px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.seg button{flex:1;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--mute);white-space:nowrap;transition:background .2s}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
/* match card (white, banner on top) */
.mc{display:block;width:calc(100% - 32px);margin:0 16px 14px;text-align:left;background:#fff;color:var(--dk);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #0006;transition:transform .15s}
.mc:active{transform:scale(.985)}
.mban{display:flex;justify-content:space-between;align-items:flex-start;padding:10px;height:112px;background:linear-gradient(135deg,#1E3A8A,#4C1D95) center/cover}
.mban.ph{height:52px;align-items:center}
.tg,.cd{background:#0A1730d9;color:#fff;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600}
.mbd{display:block;padding:12px 14px 14px}
.mbd strong{display:block;font-size:17px;font-weight:700;line-height:1.25}
.mbd small{color:#5B6B8C;font-size:13px}
.stats{display:flex;margin:12px 0 10px;border:1px solid #E3E9F5;border-radius:12px}
.stats>span{flex:1;padding:8px 4px;text-align:center;border-left:1px solid #E3E9F5}.stats>span:first-child{border:0}
.stats small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.stats b{font-size:18px;font-weight:700}
.meta{display:flex;justify-content:space-between;font-size:13px;color:#33435F;font-weight:600;margin-bottom:6px}
.bar{display:block;height:6px;background:#E3E9F5;border-radius:3px;margin:0 0 12px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--vio);border-radius:3px;transition:width .6s}
.acts{display:flex;justify-content:space-between;align-items:center;gap:10px}
.go{flex:1;text-align:center;background:var(--lime);color:#14300A;font-weight:700;padding:11px;border-radius:12px}
.go.dim{background:#E8EEF9;color:#33435F}
.tag{display:inline-block;font-weight:700;font-size:12px;padding:5px 12px;background:#DCFCE7;color:#15803D;border-radius:99px;white-space:nowrap}
.tag.bad{background:#FEE2E2;color:#B91C1C}.tag.mute{background:#E8EEF9;color:#4B5B76}
.panel .tag{background:#22C55E22;color:var(--ok)}.panel .tag.bad{background:#F8717122;color:var(--bad)}.panel .tag.mute{background:var(--s2);color:var(--mute)}
.empty{padding:40px 24px;text-align:center;color:var(--mute)}
/* animated bottom nav */
.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:#0C1E40;border-radius:24px 24px 0 0;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs[hidden]{display:none}
.tabs .ind{position:absolute;top:6px;left:6px;width:calc((100% - 12px)/4);bottom:calc(6px + env(safe-area-inset-bottom));background:#ffffff14;border-radius:16px;transform:translateX(calc(var(--i,2)*100%));transition:transform .4s cubic-bezier(.34,1.4,.5,1)}
.tabs .ind::after{content:"";position:absolute;left:50%;bottom:4px;width:24px;height:3px;border-radius:2px;background:var(--cy);transform:translateX(-50%)}
.tabs button{position:relative;flex:1;padding:9px 0 12px;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .25s}
.tabs svg{width:23px;height:23px;fill:currentColor;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.tabs button.on{color:#fff}.tabs button.on svg{transform:translateY(-2px) scale(1.15)}
.tabs button.pop svg{animation:pop .45s}
@keyframes pop{0%{transform:scale(1)}40%{transform:translateY(-7px) scale(1.3)}100%{transform:translateY(-2px) scale(1.15)}}
@media(prefers-reduced-motion:reduce){.tabs .ind,.tabs svg,.pg{transition:none;animation:none}.tabs button.pop svg{animation:none}}
.fab{position:fixed;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));width:48px;height:48px;border-radius:50%;background:var(--acc);display:grid;place-items:center;z-index:4;box-shadow:0 6px 16px #0008}.fab svg{width:24px;fill:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;font-weight:600;padding:10px 18px;border-radius:99px;z-index:9;max-width:90%}
/* sheets and forms */
.sheet{position:fixed;inset:0;background:rgba(3,8,22,.72);display:flex;align-items:flex-end;justify-content:center;z-index:8}
.panel{position:relative;background:var(--s1);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.panel h2{font-size:22px;margin-right:36px}
.himg{height:130px;margin:-20px -16px 14px;background:var(--s2) center/cover;border-radius:24px 24px 0 0}
.x{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:#0A1730aa;font-size:22px;line-height:1;color:#fff}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:14px 0;padding:12px 0;border-block:1px solid var(--line)}
dt{color:var(--mute)}dd{font-weight:600;text-align:right}
.room{background:#22D3EE14;border:1px dashed var(--cy);border-radius:12px;padding:12px 14px;margin:12px 0}.room b{font-size:20px;letter-spacing:.04em}
.refund{background:#F8717114;border:1px solid #F8717155;border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:600;color:#FFC9C9}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:8px 0 14px}
.sl{padding:10px 0;background:var(--s2);border-radius:10px;font-weight:600}
.sl[aria-pressed=true]{background:var(--lime);color:#14300A}.sl:disabled{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.sum{margin:12px 0 8px}.sum dd:last-child{color:var(--gold)}
.fp{background:#22C55E12;border:1px solid #22C55E33;border-radius:12px;padding:12px 14px;margin:14px 0 4px}
.fp b{display:block;margin-bottom:4px;color:var(--ok)}.fp li{margin:5px 0 5px 18px;color:#C9D6F0;font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px;color:#C9D6F0}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
input:focus{border-color:var(--cy);outline:none}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--lime);color:#14300A;font-weight:700;font-size:16px;margin-top:14px}
.btn.alt{background:var(--s2);color:#fff}.btn:disabled{opacity:.45}
.row2{display:flex;gap:10px;margin-top:8px}.row2 input{flex:1}.row2 .btn{margin:0;width:auto;padding:0 22px}
.err{color:var(--bad);font-weight:600;margin-top:10px;font-size:14px}.why{color:var(--mute);margin:8px 0 0;min-height:1.4em}
.pre{white-space:pre-wrap;margin-top:12px;color:#C9D6F0}
.rt{width:100%;border-collapse:collapse;margin-top:12px}.rt th,.rt td{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line)}
.rt th{color:var(--mute);font-weight:600;font-size:13px}.rt td:last-child,.rt th:last-child{text-align:right}
.rt tr.podium td{font-weight:700;color:var(--gold)}.rt tr.me td{background:#1E3A6E}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin:0 16px 12px;padding:16px}
.card h3{font-size:18px}.card p{color:var(--mute);margin:4px 0}
.pass{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin:0 16px;padding:4px 16px}
.ln{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.ln:last-child{border:0}
.ln span{color:var(--mute)}.ln.tot span{color:#fff;font-weight:700}.ln.tot b{font-size:20px;color:var(--gold)}
.h{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.h:last-child{border:0}
.h small,.req small{display:block;color:var(--mute);font-size:12px}
.pl{color:var(--ok)}.mi{color:var(--bad)}
.req{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.req:last-child{border:0}
.rr{text-align:right}.rr b{display:block;font-size:17px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile b{display:block;font-size:26px;line-height:1.1;color:var(--gold)}.tile small{color:var(--mute)}
.ts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px}
.ts div{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center}
.ts b{display:block;font-size:19px}.ts small{color:var(--mute);font-size:12px}
.win{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.win:last-child{border:0}
.win svg{width:20px;flex:none;fill:var(--ok)}.win span{flex:1;font-size:14px}.win b{color:var(--gold)}
.vf{display:inline-flex;gap:5px;align-items:center;color:#15803D;font-weight:700;font-size:12px;background:#DCFCE7;padding:4px 10px;border-radius:99px}.vf svg{width:14px;fill:currentColor}
.rk{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin:0 16px 8px}
.rk.t1{border-color:var(--gold)}.rk.t2{border-color:#C7D0E6}.rk.t3{border-color:#D98B4A}
.rk .n{font-weight:700;font-size:18px;width:26px;color:var(--mute)}.rk span{flex:1;font-weight:600}.rk b{color:var(--gold)}
.mi2{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin:0 16px 8px;width:calc(100% - 32px);font-weight:600}
.mi2 svg{width:22px;fill:var(--cy);flex:none}.mi2 span{flex:1}
.pf{display:flex;align-items:center;gap:14px;padding:4px 16px 16px}.pf h2{font-size:24px}.pf small{color:var(--mute)}
.auth{padding:calc(64px + env(safe-area-inset-top)) 22px 24px}.auth h1{font-size:40px;line-height:1.05}.auth p{color:var(--mute);margin:10px 0 18px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;margin:16px 0 0}.chk input{width:20px;height:20px;margin-top:2px;flex:none}
.pw{position:relative}.pw input{padding-right:72px}.pw button{position:absolute;right:4px;top:4px;bottom:4px;padding:0 12px;font-weight:700;color:var(--cy)}
.auth a{color:var(--cy);font-weight:700}

/* Gamex-style light auth */
.auth.lt{background:#fff;color:#111;min-height:100vh;padding:calc(56px + env(safe-area-inset-top)) 24px 40px}
.wl{font-size:40px;line-height:1.12;color:#6200FF;margin-bottom:30px;font-weight:700}
.pill{display:block;width:100%;height:54px;padding:0 22px;border:1px solid #E5E7EB;border-radius:99px;background:#fff;color:#111;box-shadow:0 3px 10px #0000001a;margin-bottom:14px}
.pill::placeholder{color:#9CA3AF}.pill:focus{border-color:#6200FF;outline:none}
.phr{display:flex;gap:10px}.phr .cc{width:84px;display:grid;place-items:center;flex:none}.phr input{flex:1}
.auth.lt .pw input{padding-right:84px}.auth.lt .pw button{top:0;bottom:14px;right:8px;color:#111;font-weight:700}
.auth.lt .chk{color:#374151;font-size:14px;margin:6px 0 4px}.auth.lt .chk input{width:20px;height:20px;box-shadow:none;accent-color:#6200FF}
.auth.lt .chk a,.auth.lt a{color:#6200FF}
.auth.lt .err{color:#DC2626;min-height:1.3em}
.pbtn{display:block;width:100%;height:56px;border-radius:99px;background:#6200FF;color:#fff;font-size:20px;font-weight:600;box-shadow:0 10px 20px #6200ff55;margin-top:12px}.pbtn:disabled{opacity:.6}
.alt{text-align:center;margin-top:26px;color:#111}.alt button{font-weight:700;color:#111}
/* wallet / recharge / withdraw (white cards on navy) */
.tb{text-align:center;padding:4px 16px 16px}.tb p{color:var(--mute);font-size:18px}.tb h2{font-size:30px;margin-top:4px}
.ul{display:block;width:96px;height:5px;border-radius:3px;background:#6366F1;margin:12px auto 0}
.gr{color:#4ADE80;margin-top:18px}
.wb{display:flex;flex-direction:column;gap:12px;padding:0 24px;margin:6px 0 10px}
.gbtn,.rbtn{padding:17px;border-radius:12px;color:#fff;font-size:19px;font-weight:600;text-align:center}.gbtn{background:#22C55E}.rbtn{background:#EF4444}
.wc{background:#fff;color:#111;border-radius:16px;margin:0 16px 16px;padding:16px}
.wc h3{font-size:19px;margin:12px 0 4px}.wc h3:first-child{margin-top:0}
.amt{display:flex;align-items:center;gap:10px;border-bottom:2px solid #E5E7EB}.amt span{font-size:32px;font-weight:700}
.wc input{background:#fff;color:#111;border:0;border-bottom:2px solid #E5E7EB;border-radius:0;padding:10px 0;box-shadow:none}.wc input:focus{border-color:#2563EB}
.amt input{border:0;font-size:32px;font-weight:700;padding:4px 0}
.sel{border-bottom:2px solid #E5E7EB;padding:10px 0;font-weight:600}
.mm{display:flex;justify-content:space-between;color:#9CA3AF;font-size:13px;margin:8px 0 16px}
.q6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.q6.q4{grid-template-columns:repeat(4,1fr)}
.q6 button{background:#DBEAFE;color:#111;border-radius:12px;padding:14px 0;font-weight:600;font-size:17px}
.bbtn{display:block;width:100%;padding:15px;border-radius:12px;background:#2563EB;color:#fff;font-size:20px;font-weight:600}.bbtn:disabled{background:#B6B9C6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wc .why{color:#6B7280}.wc .err{color:#DC2626}
.hc{background:#fff;color:#111;border-radius:16px;margin:0 16px 14px;padding:10px}
.hr{display:flex;justify-content:space-between;gap:12px;background:#F5F5F4;border-radius:8px;padding:11px 12px;margin-bottom:8px}
.hr span{color:#374151}.hr b{font-weight:600;text-align:right;word-break:break-all}
.st.ok{color:#16A34A}.st.pend{color:#D97706}.st.bad{color:#DC2626}
.cks{display:block;width:100%;padding:10px;border-radius:8px;background:#E8EEF9;color:#1E3A8A;font-weight:600}
.auth.lt .pw button{display:flex;align-items:center}
.auth.lt .alt{color:#111}.auth.lt{padding-bottom:96px}

/* Gamex-style match details and joining pages */
.hascta{padding-bottom:84px}
.cban{margin:0 16px 14px;height:170px;border-radius:18px;background:linear-gradient(135deg,#1E3A8A,#4C1D95) center/cover;border:2px solid var(--cy);display:flex;align-items:flex-end;padding:14px;font-size:28px;font-weight:700}
.tmr{margin:0 16px 14px;background:#fff;color:var(--dk);border-radius:14px;padding:14px;text-align:center;font-weight:700;font-size:17px}
.ctitle{padding:0 16px 12px;color:#4DB8FF;font-size:19px;line-height:1.3}
.ibs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:10px}
.ib{background:#fff;color:var(--dk);border-radius:12px;padding:10px 12px;text-align:center}.ib small{display:block;color:#5B6B8C;font-size:12px}.ib b{font-size:16px}
.ib.wide{margin:0 16px 4px}
.rulebox{background:#E9E7FB;color:#111;border-radius:14px;margin:0 16px 14px;padding:16px}
.rulebox h3{text-align:center;font-size:20px;border-bottom:2px solid #6B7280;padding-bottom:10px;margin-bottom:12px}

/* ---------- navigation: every page has its own URL (#/wallet, #/game/br/upcoming ...) ---------- */

const PARENT={help:'menu',match:'home',join:'home',mode:'home',mine:'home',notif:'home',wallet:'menu',addcash:'wallet',withdraw:'wallet',results:'menu'};
const toHash=(n,a={})=>'#/'+({home:'',earn:'earn',board:'leaderboard/'+(a.r||'weekly'),menu:'menu',mode:'game/'+encodeURIComponent(a.g||'')+'/'+(a.st||'upcoming'),mine:'my-matches/'+(a.st||'upcoming'),help:'help',match:'match/'+encodeURIComponent(a.id||''),join:'join/'+encodeURIComponent(a.id||''),wallet:'wallet',addcash:'add-cash',withdraw:'withdraw',notif:'notifications',results:'results'}[n]??'');
function fromHash(){
  const p=location.hash.replace(/^#\/?/,'').split('/').map(x=>{try{return decodeURIComponent(x)}catch{return x}}),k=p[0]||'';
  if(k=='game'&&p[1])return{n:'mode',a:{g:p[1],st:ST.includes(p[2])?p[2]:'upcoming'}};
  if(k=='match'&&p[1])return{n:'match',a:{id:p[1]}};
  if(k=='join'&&p[1])return{n:'join',a:{id:p[1]}};
  if(k=='my-matches')return{n:'mine',a:{st:ST.includes(p[1])?p[1]:'upcoming'}};
  if(k=='leaderboard')return{n:'board',a:{r:['weekly','monthly','all'].includes(p[1])?p[1]:'weekly'}};
  const m={help:'help',earn:'earn',menu:'menu',wallet:'wallet','add-cash':'addcash',withdraw:'withdraw',notifications:'notif',results:'results'}[k];
  return{n:m||'home',a:{}}}
async function draw(){document.querySelectorAll('.sheet').forEach(x=>x.remove());clearInterval(S.sl);try{await V[S.view.n](S.view.a||{})}catch(e){toast(e.message)}}

function textSheet(t,x){const ov=document.createElement('div');ov.className='sheet';ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><h2>${esc(t)}</h2><p class="pre">${esc(x||'This will be added soon.')}</p></div>`;document.body.appendChild(ov);ov.onclick=e=>{if(e.target==ov)ov.remove()};ov.querySelector('.x').onclick=()=>ov.remove()}

/* ---------- match details page ---------- */
const tleft=t=>{const d=Math.max(0,t-Date.now());return `${Math.floor(d/864e5)}d ${Math.floor(d%864e5/36e5)}h ${Math.floor(d%36e5/6e4)}m ${Math.floor(d%6e4/1e3)}s`};
V.match=async({id})=>{
  const m=await api('/match/'+encodeURIComponent(id));
  if(!S.user)S.user=await api('/stats');
  const fee=+m.fee||0,sz=m.size||1,my=m.mySeats||[],full=m.filled>=m.capacity,me=S.user&&S.user.username;
  const ib=(a,b)=>`<div class="ib"><small>${a}</small><b>${esc(b)}</b></div>`;
  const prizes=(m.rankPrizes||[]).length?`<table class="rt"><tr><th>Rank</th><th>Prize</th></tr>${m.rankPrizes.map((p,i)=>`<tr><td>#${i+1}</td><td>${rs(p)}</td></tr>`).join('')}</table>${m.splitPrize&&sz>1?'<p class="why">Prize is split equally within the team.</p>':''}`:'';
  const room=m.room?(m.room.hidden?`<div class="room">Room details appear shortly before the match starts. You’ll get a notification.</div>`:`<div class="room">Room ID <b>${esc(m.room.id)}</b><br>Password <b>${esc(m.room.pass||m.room.password||'')}</b></div>`):'';
  const rows=m.status=='resulted'&&Array.isArray(m.result)?[...m.result].sort((a,b)=>(a.rank||99)-(b.rank||99)):[];
  const res=rows.length?`<h2 class="sec">Result</h2><div class="pass"><table class="rt"><tr><th>Rank</th><th>Player</th><th>Kills</th><th>Prize</th></tr>${rows.slice(0,50).map(x=>`<tr class="${x.rank&&x.rank<=3?'podium':''} ${x.username===me?'me':''}"><td>${x.rank?'#'+x.rank:'-'}</td><td>${esc(x.ign||mask(x.username))}${x.username===me?' <span class="tag">You</span>':''}</td><td>${x.kills}</td><td>${rs(x.prize)}</td></tr>`).join('')}</table></div>`:'';
  const ref=m.status=='cancelled'?'<div class="refund" style="margin:0 16px 14px">Match cancelled. The entry fee was refunded to every player.</div>':'';
  const canJoin=m.status=='upcoming'&&!full&&(my.length?(sz>1&&my.length<sz):true);
  const cta=canJoin?`<button class="cta" id="jn">${my.length?'Add teammates':'Join Match'}</button>`:m.status=='upcoming'&&m.joined?`<div class="cta ok">You’re registered</div>`:m.status=='upcoming'&&full?'<div class="cta dim">Match full</div>':m.streamUrl&&m.status=='ongoing'?'<button class="cta" id="wm">Watch match</button>':'';
  mount(sub('Contest Details '+sid(m))+`
  <div class="cban" ${m.image?`style="background-image:url('${esc(m.image)}')"`:''}>${m.image?'':`<span>${esc(m.type)}</span>`}</div>
  ${m.status=='upcoming'?`<div class="tmr tl" data-end="${m.time}">Time Left: ${tleft(m.time)}</div>`:`<div class="tmr">${m.status=='ongoing'?'Match is live now':m.status=='cancelled'?'Cancelled':'Result published'}</div>`}
  <h2 class="ctitle">${esc(m.title)} - ID${sid(m)}</h2>${ref}
  <div class="ibs">${ib('Team',m.type)}${ib('Mode',m.type)}${ib('Map',m.map||'To be announced')}${ib('Match Type',fee?'Paid':'Free')}${ib('Entry Fee',fee?rs(fee):'Free')}${ib('Per kill',+m.perKill?rs(m.perKill):'-')}</div>
  <div class="ib wide">Match Schedule: <b>${dayOf(m.time)} at ${new Date(m.time).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'})}</b></div>
  <h2 class="sec">Prize Details</h2><div class="pass"><div class="ln"><span>Prize pool</span><b>${rs(m.prize)}</b></div>${prizes}</div>
  ${room?`<div style="padding:12px 16px 0">${room}</div>`:''}${res}
  <h2 class="sec">About this Match</h2><div class="rulebox"><h3>Rules and Regulations</h3><p class="pre" style="color:#111">${esc(S.set.rules||'Rules will be added soon.')}</p></div>
  <div class="fp" style="margin:0 16px 14px"><b>Fair play</b><ul><li>Room ID and password appear in the app before the match starts.</li><li>If a match is cancelled or doesn’t fill, your entry fee returns to your wallet.</li><li>Every result is published with rank, kills and prize for each player.</li></ul></div>${cta}`,{nonav:true,cta:!!cta});
  const j=$('#jn');if(j)j.onclick=()=>nav('join',{id});const w=$('#wm');if(w)w.onclick=()=>openUrl(m.streamUrl);

function pdModal(cur,done){
  const ov=document.createElement('div');ov.className='sheet';
  ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><h2>Player Game Details</h2>
  <label for="pn">In-game name</label><input id="pn" maxlength="30" value="${esc(cur.ign||'')}">

  <div class="two"><button class="rbtn" id="pc">Cancel</button><button class="btn" id="ps" style="margin:0">Save</button></div></div>`;
  document.body.appendChild(ov);const close=()=>ov.remove();ov.onclick=e=>{if(e.target==ov)close()};$('#pc').onclick=close;
  $('#ps').onclick=()=>{const n=$('#pn').value.trim(),g=$('#pi').value.replace(/\D/g,'');

V.join=async({id})=>{
  const [m,w]=await Promise.all([api('/match/'+encodeURIComponent(id)),api('/wallet')]);S.user=w;
  if(m.status!='upcoming'){nav('match',{id},1);return}
  if(!S.jn||S.jn.id!=id)S.jn={id,sel:[],step:1};
  const J=S.jn,sz=m.size||1,fee=+m.fee||0,seats=m.seats||[],my=m.mySeats||[],myTeam=my.length?my[0].slot:0,L='ABCDEFGH';
  const saved=(()=>{try{return{ign:localStorage.getItem('ign')||S.user.ign||'',gid:localStorage.getItem('gid')||''}}catch{return{ign:S.user.ign||'',gid:''}}})();
  const taken=(s,p)=>seats.some(x=>x.slot==s&&x.pos==p);
  const isMine=(s,p)=>my.some(x=>x.slot==s&&x.pos==p);
  const info=()=>`<div class="jsum"><div class="wi">${ic(P.wal)}</div><div class="jl"><p>Your Current Balance : <b>${rs(w.total)}</b></p><p>Entry Fee Per Person : <b>${fee?rs(fee):'Free'}</b></p><p>Total Payable Amount : <b id="tp">${rs(fee*J.sel.length)}</b></p></div></div>`;
  const step1=()=>{
    mount(sub('Joining Match')+info()+`<div class="selh">Select Match Position</div>
    <div class="thead"><span class="tn">Team</span><span class="pos">${Array.from({length:sz},(_,p)=>`<span class="ph">${sz==1?'':L[p]}</span>`).join('')}</span></div>
    ${Array.from({length:m.slots},(_,i)=>i+1).map(t=>`<div class="trow"><span class="tn">${sz==1?'Slot':'Team'} ${t}</span><span class="pos">${Array.from({length:sz},(_,p)=>{const tk=taken(t,p),mi=isMine(t,p),dis=tk||(myTeam&&t!=myTeam);return `<button class="cb ${mi?'me':tk?'tk':''}" data-t="${t}" data-p="${p}" ${dis?'disabled':''} aria-label="${sz==1?'Slot':'Team'} ${t}${sz>1?' position '+L[p]:''}${tk?' taken':''}">${mi?'You':''}</button>`}).join('')}</span></div>`).join('')}
    <div class="note">Note - Select your position, then enter your in-game name and ID.</div><button class="cta" id="nx" disabled>Join Now</button>`,{nonav:true,cta:true});
    const nx=$('#nx'),mark=()=>{A.querySelectorAll('.cb:not(.tk):not(.me)').forEach(b=>b.classList.toggle('sel',J.sel.some(x=>x.slot==b.dataset.t&&x.pos==b.dataset.p)));$('#tp').textContent=rs(fee*J.sel.length);nx.disabled=!J.sel.length};
    A.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{const s=+b.dataset.t,p=+b.dataset.p,i=J.sel.findIndex(x=>x.slot==s&&x.pos==p);
      if(i>=0)J.sel.splice(i,1);else{if(sz==1||(J.sel.length&&J.sel[0].slot!=s))J.sel=[];if(my.length+J.sel.length>=sz){toast('Your team is already full.');return}J.sel.push({slot:s,pos:p,ign:'',gid:''})}mark()});
    nx.onclick=()=>{if(J.sel[0]&&!J.sel[0].ign&&saved.ign&&saved.gid){J.sel[0].ign=saved.ign;J.sel[0].gid=saved.gid}J.step=2;step2()};mark()};
  const step2=()=>{
    const need=fee*J.sel.length,short=fee&&need>w.total;
    mount(sub('Joining Match')+info()+`<div class="wc" style="margin-top:6px"><h3 style="text-align:center">Selected Position</h3>
    <table class="rt dk"><tr><th>Team</th><th>Position</th><th>InGameName</th></tr>${J.sel.map((x,i)=>`<tr><td>${sz==1?'Slot':'Team'} ${x.slot}</td><td>${sz==1?1:L[x.pos]}</td><td><button class="addi ${x.ign?'done':''}" data-i="${i}">${x.ign?esc(x.ign):'Add info'}</button></td></tr>`).join('')}</table></div>
    ${short?`<div class="refund" style="margin:0 16px 12px">Add ${rs(need-w.total)} more to join. <button class="tag" id="ac" style="margin-left:6px">Add cash</button></div>`:''}
    <div class="err" id="er" role="alert" style="padding:0 16px"></div>
    <div class="two" style="padding:0 16px"><button class="rbtn" id="cn">Cancel</button><button class="btn" id="jb" style="margin:0" ${J.sel.every(x=>x.ign&&x.gid)&&!short?'':'disabled'}>Join</button></div>
    <div class="note">Note - Please enter your in-game username/name exactly as it appears in the game.</div>`,{nonav:true});
    A.querySelectorAll('.addi').forEach(b=>b.onclick=()=>pdModal(J.sel[+b.dataset.i],d=>{Object.assign(J.sel[+b.dataset.i],d);step2()}));
    $('#cn').onclick=()=>{J.step=1;step1()};const ac=$('#ac');if(ac)ac.onclick=()=>nav('addcash');
    $('#jb').onclick=async()=>{$('#jb').disabled=true;try{await api('/join',{matchId:id,seats:J.sel.map(x=>({slot:x.slot,pos:x.pos,ign:x.ign,gid:x.gid}))});S.jn=null;toast('You’re in. Room details will appear before start.');nav('mine',{st:'upcoming'},1)}catch(e){$('#er').textContent=e.message;$('#jb').disabled=false}}};
  J.step==2&&J.sel.length?step2():step1()};

/* ---------- wallet, add cash, withdraw, notifications, results ---------- */
const chip=x=>{x=String(x||'pending');const k=/approv|success|paid|complete/.test(x)?'':/reject|fail|cancel/.test(x)?'bad':'mute';return `<span class="tag ${k}">${esc(x)}</span>`};

  A.querySelectorAll('.q6 button').forEach(b=>b.onclick=()=>{$('#am').value=b.dataset.v});
  $('#go').onclick=async()=>{const a=+$('#am').value;$('#er').textContent='';if(!a||a<mn||a>mx){$('#er').textContent=`Enter an amount between ${rs(mn)} and ${rs(mx)}.`;return}
    $('#go').disabled=true;try{const r=await api('/deposit',{amount:a});try{localStorage.setItem('po',r.orderId)}catch{}location.href=r.url}catch(e){$('#er').textContent=e.message;$('#go').disabled=false}};bindChk()};
V.withdraw=async()=>{
  const w=await api('/wallet');S.user=w;const mn=+S.set.minWithdraw||0,fp=+S.set.withdrawFee||0,pend=(w.withdrawals||[]).some(x=>x.status=='pending'),c=wCards(w);
  mount(sub('Withdraw')+`<div class="tb"><p>Win Balance</p><h2>${rs(w.win)}</h2></div>
  <div class="wc"><h3>Withdrawal Method</h3><div class="sel">UPI</div><h3>UPI ID</h3><input id="up" autocapitalize="none" placeholder="Enter UPI ID (name@bank)">
  <h3>Amount</h3><div class="amt"><span>₹</span><input id="am" type="number" inputmode="numeric" placeholder="${mn||50} or more" aria-label="Amount"></div>
  <div class="q6 q4">${[50,100,200,500].map(v=>`<button data-v="${v}">₹${v}</button>`).join('')}</div>
  <p class="why" id="rc"></p><div class="err" id="er" role="alert"></div>
  <div class="two"><button class="rbtn" id="cn">Cancel</button><button class="bbtn" id="go" disabled>Withdraw</button></div></div>
  ${c.wd?`<h2 class="sec c">Withdrawals History</h2>${c.wd}`:''}`);
  const upd=()=>{const a=+$('#am').value,u=$('#up').value.trim();let why='';
    if(pend)why='You already have a pending withdrawal. Wait until it is processed.';
    else if(!a)why='Enter an amount.';else if(a<mn)why=`Minimum withdrawal is ${rs(mn)}.`;else if(a>w.win)why=`You can withdraw up to ${rs(w.win)} (winnings only).`;
    else if(!/^[\w.\-]{2,}@[\w]{2,}$/.test(u))why='Enter a valid UPI ID, like name@bank.';
    $('#er').textContent=why;$('#go').disabled=!!why;$('#rc').textContent=a&&!why?`Fee ${rs(a*fp/100)} · You receive ${rs(a-a*fp/100)}`:''};
  A.querySelectorAll('.q6 button').forEach(b=>b.onclick=()=>{$('#am').value=b.dataset.v;upd()});
  $('#am').oninput=upd;$('#up').oninput=upd;upd();$('#cn').onclick=goBack;
  $('#go').onclick=async()=>{$('#go').disabled=true;try{await api('/withdraw',{amount:+$('#am').value,method:'UPI',upi:$('#up').value.trim()});toast('Withdrawal requested');nav('wallet',{},1)}catch(e){$('#er').textContent=e.message;$('#go').disabled=false}};bindChk()};
V.notif=async()=>{
  const nt=await api('/notifications');try{localStorage.setItem('nseen',String(Date.now()))}catch{}
  mount(sub('Notifications')+(nt.length?`<div class="pass">${nt.map(n=>`<div class="h"><div><b>${esc(n.title||'Update')}</b><small style="font-size:14px;color:var(--ink)">${esc(n.msg||n.body||n.text||n.message||'')}</small><small>${n.at?ago(n.at):''}</small></div></div>`).join('')}</div>`:'<div class="empty">No notifications yet.</div>'))};
V.results=async()=>{
  const rows=await api('/results');
  mount(sub('Match results')+`<p class="day">Every result is listed with rank, kills and prize for each player.</p>`+(rows.length?rows.map(r=>{const w=r.rows[0];return `<button class="mc cut" data-r="${esc(r.id)}"><span class="bn"><span class="tg">${esc(r.type)}</span><span class="vf">${ic(P.sh)}Result published</span></span><span class="bd"><strong>${esc(r.title)}</strong><small>${dayOf(r.time)} · ${esc(r.map||'')} · Prize pool ${rs(r.prize)}</small>${w?`<span class="rw"><span class="pr"><small>Winner: ${esc(w.name)}</small><b>${rs(w.prize)}</b></span><span class="go dim">View table</span></span>`:''}</span></button>`}).join(''):'<div class="empty">Results appear here after the first match finishes.</div>'));
  A.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.r),ov=document.createElement('div');ov.className='sheet';
    ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><h2>${esc(r.title)}</h2><table class="rt"><tr><th>Rank</th><th>Player</th><th>Kills</th><th>Prize</th></tr>${r.rows.map(x=>`<tr><td>${x.rank?'#'+x.rank:'-'}</td><td>${esc(x.name)}</td><td>${x.kills}</td><td>${rs(x.prize)}</td></tr>`).join('')}</table></div>`;
    document.body.appendChild(ov);ov.onclick=e=>{if(e.target==ov)ov.remove()};ov.querySelector('.x').onclick=()=>ov.remove()})};

/* ---------- help: FAQ and real support tickets ---------- */
const CATS=['Deposit not credited','Withdrawal issue','Coins or prize not received','Match or result issue','Account problem','Other'];
function ticketModal(pre,done){
  const ov=document.createElement('div');ov.className='sheet';
  ov.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><button class="x" aria-label="Close">×</button><h2>Raise a ticket</h2>
  <label for="tc">Problem type</label><select id="tc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
  <label for="tx">Transaction or order ID (if you have it)</label><input id="tx" autocapitalize="none">
  <label for="tm">Describe the problem</label><textarea id="tm" maxlength="400" rows="4">${esc(pre||'')}</textarea>
  <div class="err" id="te" role="alert"></div><button class="btn" id="tg">Submit ticket</button></div>`;
  document.body.appendChild(ov);const close=()=>ov.remove();ov.onclick=e=>{if(e.target==ov)close()};ov.querySelector('.x').onclick=close;
  $('#tg').onclick=async()=>{const t=$('#tm').value.trim(),x=$('#tx').value.trim();if(!t){$('#te').textContent='Describe the problem first.';return}
    $('#tg').disabled=true;try{await api('/ticket',{subject:$('#tc').value,text:((x?'Order/Txn ID: '+x+'\n':'')+t).slice(0,500)});close();toast('Ticket created. Support will reply here.');done()}catch(e){$('#te').textContent=e.message;$('#tg').disabled=false}}}
const FAQ=[['How do I join a match?','Open a game on Home, choose a match, tap Join Match, pick your slot or team position, then enter your in-game name and in-game ID.'],['When do I get the room ID?','The room ID and password appear in the app shortly before the match starts, and you get a notification.'],['What if a match is cancelled?','If a match is cancelled or does not fill, the entry fee returns to your wallet.'],['Where can I see results?','Open a game and choose the Result tab, or go to Menu and tap Match results. Every result lists rank, kills and prize for each player.'],['Daily reward and referral','Go to the Earn tab. Collect the daily reward once a day and share your referral code with friends.'],['Who can play?','You must be 18 or older. Follow the rules shown on every match page.']];
V.help=async()=>{
  let tickets=[];try{tickets=await api('/tickets')}catch{}
  const url=helpUrl();
  mount(sub('Help and Support')+`<div class="card"><h3>Need help with payment?</h3><p>Deposit, withdrawal or coins not received? Raise a ticket and our support team will reply here.</p><button class="btn" id="rt">Raise a ticket</button>${url?'<button class="btn alt" id="wa">Chat on WhatsApp or Telegram</button>':''}</div>
  <h2 class="sec">Common questions</h2>${FAQ.map(f=>`<details class="faq"><summary>${esc(f[0])}</summary><p>${esc(f[1])}</p></details>`).join('')}
  <h2 class="sec">My tickets</h2>${tickets.length?tickets.map(tk=>`<div class="hc"><div class="hr"><span>${esc(tk.subject)}</span>${stc(tk.status)}</div>${tk.msgs.slice(-4).map(x=>`<div class="tmsg ${x.from=='user'?'u':'a'}"><small>${x.from=='user'?'You':'Support'} · ${ago(x.at)}</small>${esc(x.text)}</div>`).join('')}<div class="row2"><input data-r="${esc(tk.id)}" placeholder="Reply" aria-label="Reply to ticket"><button class="btn" data-rs="${esc(tk.id)}">Send</button></div></div>`).join(''):'<div class="empty">No tickets yet.</div>'}`);
  $('#rt').onclick=()=>ticketModal('',()=>V.help());const wa=$('#wa');if(wa)wa.onclick=()=>openUrl(url);
  A.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{const i=A.querySelector(`[data-r="${b.dataset.rs}"]`),t=i.value.trim();if(!t)return;b.disabled=true;try{await api('/ticket',{id:b.dataset.rs,text:t});toast('Reply sent');V.help()}catch(e){toast(e.message);b.disabled=false}})};

/* ---------- payment return check ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function checkPending(){if(S.cp)return;S.cp=true;try{await _cp()}finally{S.cp=false}}
async function _cp(){
  let id=null;try{id=localStorage.getItem('po')}catch{}if(!id)return;
  const done=()=>{try{localStorage.removeItem('po')}catch{}};
  for(let i=0;i<8;i++){
    try{const r=await api('/deposit/check/'+encodeURIComponent(id));
      if(r.status=='approved'){done();if(r.user)S.user=r.user;toast('Deposit successful. Wallet updated.');draw();return}
      if(r.status=='failed'){done();toast('Payment failed. No money was added.');return}
      if(r.status=='review'){done();toast('Payment is under review. Support will confirm it shortly.');return}
    }catch(e){if(/not found/i.test(e.message)){done();return}}
    await sleep(4000)}
  toast('Payment is still processing. Check Wallet in a minute.')}
/* ---------- start ---------- */
async function boot(){
  try{S.set=await (await fetch('/api/settings')).json();document.title=S.set.appName||'WolfClash'}catch{}
  if(S.set.maintenance){hideNav();A.innerHTML=`<div class="auth"><h1 class="disp">Back soon</h1><p>${esc(S.set.maintenanceMsg||'We are doing maintenance.')}</p></div>`;return}
  try{S.trust=await (await fetch('/api/trust')).json()}catch{}
  if(!tk())return authView();
  try{S.user=await api('/stats');route();checkPending()}catch{authView()}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.user)checkPending()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script></body></html>
