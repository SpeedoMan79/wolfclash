<title>Arena Battle</title>

<style>
:root{--bg:#070d1f;--s1:#101a33;--s2:#16223f;--s3:#1d2b50;--line:#ffffff14;--tx:#e8eeff;--mu:#8fa0c8;
--ac:#6a5cff;--ac2:#00d2ff;--gold:#ffc233;--g:#2ee59d;--r:#ff4d6d;--grad:linear-gradient(135deg,#6a5cff,#00b8ff)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{background:#03060f}
body{background:radial-gradient(900px 400px at 50% -100px,#1b2a66 0,transparent 70%),var(--bg);color:var(--tx);max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px;position:relative}

.back{width:36px;height:36px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.av{width:40px;height:40px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.hello{flex:1;min-width:0}.hello small{display:block;color:var(--mu);font-size:11px}.hello b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pill{display:flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;cursor:pointer}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffe08a,#f0a500);color:#6b4500;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn{width:40px;height:40px;border-radius:14px;background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.wrap{padding:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.h2{font-size:15px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between}

label{font-size:12px;color:var(--mu);margin-left:2px}

button.g{background:linear-gradient(135deg,#16c784,#2ee59d);color:#04281a}button.r{background:linear-gradient(135deg,#ff4d6d,#ff7a59)}button.o{background:var(--s3);border:1px solid var(--line)}button:disabled{opacity:.45}
button.sm{width:auto;padding:9px 16px;margin:0;font-size:13px;border-radius:11px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#0b1430f2;backdrop-filter:blur(14px);display:flex;border-top:1px solid var(--line);z-index:12;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11px;color:var(--mu);cursor:pointer;border-radius:14px}
nav div.on{color:#fff;background:var(--s2)}nav div.on svg{stroke:var(--ac2)}
.marq{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;overflow:hidden;white-space:nowrap;display:flex;gap:8px;align-items:center;margin-bottom:12px}
.marq span{display:inline-block;animation:mq 18s linear infinite}@keyframes mq{0%,10%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:12px;background:linear-gradient(135deg,#7b1230,#d1213d 60%,#ff7a3d);padding:16px;text-align:center}
.hero h2{font-size:19px;letter-spacing:.5px;margin-bottom:10px;text-shadow:0 2px 8px #0006}
.hero table{width:100%;border-collapse:separate;border-spacing:4px}.hero th{font-size:12px;opacity:.9;padding:2px}.hero td{background:#0000003a;border-radius:8px;padding:6px;font-weight:700}
.slides{position:relative;border-radius:20px;overflow:hidden;margin-bottom:12px;aspect-ratio:16/8;background:var(--s2)}
.slides .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .6s}.slides .sl.on{opacity:1}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dots i{width:6px;height:6px;border-radius:50%;background:#fff6}.dots i.on{background:#fff;width:16px;border-radius:4px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 4px;text-align:center;font-size:11px;cursor:pointer;color:var(--mu)}
.qa div span{display:flex;width:38px;height:38px;border-radius:13px;margin:0 auto 6px;align-items:center;justify-content:center;color:#fff}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats3 div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center}.stats3 b{display:block;font-size:20px}.stats3 small{color:var(--mu);font-size:11px}
.mm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mm div{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 4px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
.mm div span{width:42px;height:42px;border-radius:14px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;color:#fff}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{border-radius:18px;overflow:hidden;cursor:pointer;background:var(--s1);border:1px solid var(--line)}
.game .im{height:100px;background:linear-gradient(135deg,#ff8a3d,#b3182f);display:flex;align-items:flex-end;justify-content:flex-start;font-weight:900;padding:10px;background-size:cover;background-position:center;font-size:18px;line-height:1.05;text-shadow:0 2px 6px #000a}
.game .t{padding:10px 12px;font-size:12px;display:flex;justify-content:space-between;align-items:center;color:var(--mu)}.game .t i{color:var(--g);font-style:normal;font-weight:700;background:#2ee59d22;border-radius:999px;padding:2px 9px}
.tabs{display:flex;gap:6px;padding:12px 14px 0;overflow-x:auto}.tabs div{flex:1;text-align:center;padding:10px 12px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap}.tabs div.on{background:var(--grad);color:#fff;border-color:transparent}
.m{padding:0;overflow:hidden}.m .im{height:130px;background:linear-gradient(135deg,#ff8a3d,#b3182f);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:12px;font-weight:900;font-size:20px;text-shadow:0 2px 8px #000a;position:relative}
.m .tag{position:absolute;top:10px;right:10px;background:#000a;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;text-shadow:none}
.m .bd{padding:14px}.m h3{font-size:15px;line-height:1.3}.m small{color:var(--mu)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.g3 div{background:var(--s2);border-radius:12px;padding:9px 4px;text-align:center;font-size:10px;color:var(--mu);letter-spacing:.4px}.g3 b{display:block;color:var(--tx);font-size:14px;margin-top:3px;letter-spacing:0}
.bar{height:6px;background:var(--s3);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2ee59d,#ffc233,#ff4d6d);border-radius:4px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.foot span{font-size:12px;color:var(--mu)}.foot button{width:auto;padding:11px 26px;margin:0}
.room{background:#6a5cff22;border:1px dashed var(--ac);border-radius:12px;padding:10px;margin:10px 0;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.res{font-size:12px;color:var(--mu);line-height:1.8;margin-top:8px}
.rank{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.rank .n{width:32px;height:32px;border-radius:10px;background:var(--s3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.rank.t1 .n{background:linear-gradient(135deg,#ffe08a,#f0a500);color:#5b3b00}.rank.t2 .n{background:linear-gradient(135deg,#eef2ff,#9aa8c7);color:#222}.rank.t3 .n{background:linear-gradient(135deg,#ffb27a,#c06a2b);color:#3a1a00}
.rank b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis}.rank .v{display:flex;gap:6px;align-items:center;font-weight:700}
.li{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px;cursor:pointer}
.li .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}.li .ch{margin-left:auto;color:var(--mu)}.li .ch svg{width:18px;height:18px}
.pf{text-align:center;padding:10px 0 4px}.pf .big{width:92px;height:92px;border-radius:30px;background:var(--grad);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 30px #6a5cff55}
.bal{background:var(--grad);border-radius:22px;padding:20px;text-align:center;margin-bottom:12px;box-shadow:0 14px 40px #4361ee44}.bal small{opacity:.85}.bal h1{font-size:38px;margin:4px 0}
.bal .sp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.bal .sp div{background:#0000002e;border-radius:12px;padding:8px;font-size:11px}.bal .sp b{display:block;font-size:15px}
.tx{display:flex;gap:12px;align-items:center;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}.tx .d{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.tx .c{background:#2ee59d22;color:var(--g)}.tx .e{background:#ff4d6d22;color:var(--r)}.tx div.m2{flex:1;min-width:0;font-size:13px}.tx small{color:var(--mu);font-size:11px;display:block}.tx .a{font-weight:800;text-align:right;font-size:14px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.chips div{background:var(--s2);border:1px solid var(--line);padding:12px;text-align:center;border-radius:12px;cursor:pointer;font-weight:700}.chips div:active{background:var(--ac)}
.hist{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:8px;font-size:13px}.hist div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.hist div:last-child{border:0}.hist span{color:var(--mu)}
.st{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}.st.approved,.st.paid{background:#2ee59d22;color:var(--g)}.st.pending,.st.open{background:#ffc23322;color:var(--gold)}.st.rejected,.st.failed,.st.closed{background:#ff4d6d22;color:var(--r)}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fi .2s}.modal .box{background:var(--s1);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow:auto;animation:su .25s}
@keyframes fi{from{opacity:0}}@keyframes su{from{transform:translateY(40px)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#0b1430;color:#fff;padding:12px 20px;border-radius:14px;z-index:60;border:1px solid var(--line);box-shadow:0 10px 30px #0008;max-width:90%;text-align:center;font-size:14px}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px}
.auth .logo{width:80px;height:80px;border-radius:26px;background:var(--grad);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 12px 40px #6a5cff66}
.auth h1{text-align:center;font-size:26px}.auth p.s{text-align:center;color:var(--mu);margin:4px 0 24px;font-size:14px}.auth a{color:var(--ac2);cursor:pointer;font-weight:600}
.ref{background:linear-gradient(160deg,#3a1bb8,#6a35ff);border-radius:24px;padding:22px 18px;text-align:center;line-height:1.55;margin-bottom:12px}
.code{background:#ffffff1f;border:2px dashed #fff8;border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin:16px 0;font-size:22px;font-weight:800;letter-spacing:1px}
.sh{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sh button{margin:0;padding:12px 4px;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:40px 0;font-size:14px}.empty b{display:block;font-size:40px;margin-bottom:6px}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}.avs div{font-size:26px;text-align:center;padding:8px 0;background:var(--s2);border-radius:12px;cursor:pointer;border:2px solid transparent}.avs div.on{border-color:var(--ac2)}
.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;line-height:1.4}.msg.user{background:var(--ac);margin-left:auto;border-bottom-right-radius:4px}.msg.admin{background:var(--s2);border-bottom-left-radius:4px}.msg small{display:block;opacity:.6;font-size:10px;margin-top:3px}
.maint{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.maint b{font-size:64px}
.sk{height:90px;border-radius:18px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}@keyframes sk{to{background-position:-200% 0}}

async function api(p,body){
  const r=await fetch('/api'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tk()||'')},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status==503){maint(j.error);throw new Error(j.error)}
    if(r.status==401&&tk()){setTk(null);U=null;authView();throw new Error('Login again')}
    throw new Error(j.error||'Something went wrong')}

  try{S=await api('/settings')}catch{S={appName:'Arena Battle',depositBonus:[],banners:[]}}

  ${x.room?`<div class="room"><span>Room ID: <b>${esc(x.room.id||'Soon')}</b></span><span>Pass: <b>${esc(x.room.pass||'Soon')}</b></span><span onclick="copyT('${esc(x.room.id)}')" style="cursor:pointer">${ico('copy')}</span></div>`:''}
  ${x.result?`<div style="margin-top:8px">${x.result.map(r=>`<div class="rr"><b>${r.rank?'#'+r.rank:'-'}</b><span>${esc(r.ign||r.username)} <em>${r.kills} kills</em></span><b style="color:var(--g)">₹${r.prize}</b></div>`).join('')}</div>`:''}
  ${x.status=='upcoming'?`<div class="bar"><i style="width:${pct}%"></i></div><div class="foot"><span>${x.mine?'Your slot: <b style="color:var(--ac2)">'+slotLbl(x.mine.slot,x.mine.pos,x.size)+'</b>':full?'Match full':`${x.filled}/${cap} joined`}</span>${x.joined?`<button class="o" onclick="joinM(${i},1)">Change slot</button>`:full?'<button disabled>Full</button>':`<button onclick="joinM(${i})">Join ₹${x.fee}</button>`}</div>`:x.mine?`<div class="foot"><span>Your slot: <b style="color:var(--ac2)">${slotLbl(x.mine.slot,x.mine.pos,x.size)}</b></span></div>`:''}</div></div>`}
function detail(i){const x=window._M[i];modal(`<h3>${esc(x.title)}</h3><p class="mu" style="text-align:left">${fmtT(x.time)} • ${esc(x.type)} • ${esc(x.map||'')}</p>${x.rankPrizes.length?`<div class="card"><b>Prize distribution</b>${x.splitPrize&&x.size>1?'<small style="color:var(--mu)"> (team me barabar split)</small>':''}${x.rankPrizes.map((p,k)=>`<div class="rr"><b>#${k+1}</b><span></span><b style="color:var(--g)">₹${p}</b></div>`).join('')}</div>`:''}<b style="font-size:13px">Slots</b>${seatGrid(x,0)}<div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.7;color:var(--mu)">${esc(S.rules)}</div><button class="o" onclick="closeM()">Close</button>`)}
function joinM(i,ch){const x=window._M[i];SEL=null;
  modal(`<h3>${ch?'Change your slot':'Pick your slot'}</h3><div class="fee"><span>Entry fee <b>₹${x.fee}</b></span><span>Balance <b>₹${U.total}</b></span></div>${ch?'':`<label>In-game name</label><input id="ign" placeholder="Your in-game name" value="${esc(U.ign||'')}">`}<div class="lg" style="margin-top:8px"><i class="lf"></i>Free<i class="lt"></i>Taken<i class="lm"></i>You<i class="ls"></i>Selected</div>${seatGrid(x,1)}<p id="sel" class="mu">${x.size>1?'Team me apni jagah (A/B…) tap karo':'Apna slot number tap karo'}</p><button onclick="confJoin('${x.id}',${!!ch})">${ch?'Move to this slot':'Confirm & Join ₹'+x.fee}</button><button class="o" onclick="closeM()">Cancel</button>${!ch&&U.total<x.fee?'<p style="color:var(--r);font-size:13px;margin-top:10px;text-align:center">Balance kam hai — pehle Add Cash karo</p>':''}`)}
async function confJoin(id,ch){if(!SEL)return toast('Pehle slot choose karo');try{await api(ch?'/change-slot':'/join',{matchId:id,ign:($('#ign')||{}).value,slot:SEL.s,pos:SEL.p});closeM();toast(ch?'Slot changed ✓':'Joined ✓');U=await api('/stats');render()}catch(e){toast(e.message);if(/slot/i.test(e.message))render()}}
function bonusPrev(){const v=+$('#am').value;let b=0;(S.depositBonus||[]).slice().sort((x,y)=>y.dep-x.dep).some(t=>{if(v>=t.dep){b=t.bonus;return true}});$('#bp').textContent=b?` Extra +${b} bonus coins milenge!`:''}
function wdPrev(){const v=+$('#wa').value||0,f=Math.round(v*(S.withdrawFee||0))/100;$('#wp').textContent=S.withdrawFee?`Fee ${S.withdrawFee}% = ₹${f} • You get ₹${v-f}`:''}
async function recharge(){try{const r=await api('/deposit',{amount:$('#am').value});location.href=r.url}catch(e){toast(e.message)}}
async function checkPay(id){toast('Payment check ho raha hai…');for(let i=0;i<6;i++){try{const r=await api('/deposit/check/'+id);if(r.status!='pending'){toast(r.status=='approved'?'Deposit added ✓':'Payment '+r.status);return tab('wallet')}}catch{}await new Promise(r=>setTimeout(r,3000))}toast('Abhi pending hai. Thodi der baad check karo.')}
async function withdraw(){try{await api('/withdraw',{method:$('#mt').value,upi:$('#up').value,amount:$('#wa').value});toast('Request bhej di ✓');render()}catch(e){toast(e.message)}}
async function daily(){try{const r=await api('/daily',{});toast(`+${r.reward} coins mile `);U=await api('/stats');render()}catch(e){toast(e.message)}}
async function promo(){try{const r=await api('/promo',{code:$('#pc').value});toast(`+${r.bonus} bonus coins `);render()}catch(e){toast(e.message)}}
function pickAv(el,v){window._av=v;document.querySelectorAll('.avs div').forEach(d=>d.classList.remove('on'));el.classList.add('on')}
async function saveProf(){try{await api('/profile',{ign:$('#ig').value,avatar:window._av});toast('Saved ✓')}catch(e){toast(e.message)}}
async function chPw(){try{await api('/password',{old:$('#op').value,new:$('#np').value});toast('Password changed ✓');$('#op').value=$('#np').value=''}catch(e){toast(e.message)}}
async function newTicket(){try{await api('/ticket',{subject:$('#ts').value,text:$('#tm').value});toast('Ticket sent ✓');render()}catch(e){toast(e.message)}}
async function reply(id){try{await api('/ticket',{id,text:$('#tr').value});render()}catch(e){toast(e.message)}}
function copyT(t){try{navigator.clipboard.writeText(t);toast('Copied ✓')}catch{toast(t)}}
function share(t){const link=location.origin+'/?ref='+U.username,msg=encodeURIComponent(`Join ${S.appName}! Mera referral code: ${U.username}\n${link}`);window.open({t:'https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+msg,f:'https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(link),w:'https://wa.me/?text='+msg}[t],'_blank')}
function mi(k){if(k.startsWith('page:')){const m=k.slice(5);return go('page',{k:m,t:{faq:'FAQ',about:'About Us',privacy:'Privacy Policy',terms:'Terms & Conditions'}[m]})}go(k)}
boot();
</script></body></html>
