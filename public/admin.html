<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Esports App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #030712;
            color: #ffffff;
            padding: 20px;
            max-width: 450px;
            margin: auto;
        }
        .card {
            background: #0f1d3a;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-size: 13px; color: #94a3b8; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #182a4d;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #22c55e;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎮 Admin Panel</h2>
        <form id="matchForm">
            <label>Tournament Title</label>
            <input type="text" id="title" placeholder="e.g. SOLO SURVIVAL #190888" required>

            <label>Time & Date</label>
            <input type="text" id="time" placeholder="e.g. Today at 08:20 PM" required>

            <label>Map</label>
            <input type="text" id="map" placeholder="e.g. Bermuda" required>

            <label>Prize Pool (₹)</label>
            <input type="number" id="prizePool" required>

            <label>Per Kill (₹)</label>
            <input type="number" id="perKill" required>

            <label>Entry Fee (₹)</label>
            <input type="number" id="entryFee" required>

            <label>Total Spots</label>
            <input type="number" id="totalSpots" value="20" required>

            <button type="submit">Create Tournament</button>
        </form>
    </div>

    <script>
        document.getElementById('matchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                title: document.getElementById('title').value,
                time: document.getElementById('time').value,
                map: document.getElementById('map').value,
                prizePool: document.getElementById('prizePool').value,
                perKill: document.getElementById('perKill').value,
                entryFee: document.getElementById('entryFee').value,
                totalSpots: document.getElementById('totalSpots').value
            };

            const res = await fetch('/api/admin/create-tournament', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            if(result.success) {
                alert('Tournament successfully create ho gaya!');
                document.getElementById('matchForm').reset();
            } else {
                alert('Error aa gaya!');
            }
        });
    </script>

</body>
</html>
